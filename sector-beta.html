  --hold:#4FB3A9; --dip:#E0B25A; --warn:#E08A5A; --broke:#D9636A; --lag:#8FA7FF;

*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--ink);color:var(--text)}

<script>
/* CORE-START : 순수 계산 로직 (DOM/네트워크 없음) */
const DEFAULT_SECTORS = {
  "RWA·토큰화": ["QNT","ONDO","LINK","POLYX","PLUME","SYRUP","CFG"],
  "상호운용·브릿지": ["DBR","ZRO","W","AXL","ACX","QNT","LINK"],
  "프라이버시": ["ZEC","XMR","DASH","ROSE","SCRT","NYM","ZEN"],
  "Base 생태계": ["AERO","VIRTUAL","ZORA","DEGEN","B3","BRETT"],
  "게이밍": ["IMX","BEAM","PRIME","YGG","GALA","SAND","B3"],
  "솔라나 디파이": ["JUP","RAY","DRIFT","JTO","ORCA","KMNO","PYTH"],
  "폴카닷": ["DOT","KSM","GLMR","MOVR","ASTR"],
  "AI·DePIN": ["TAO","RENDER","IO","AKT","GRASS","HNT","IOTX","FET"]
};

const DEFAULT_CFG = {
  lookbackH: 24,     // 섹터 상승률 측정 구간 (1h봉 개수)
  confirmPct: 10,    // 이 % 이상 오른 종목이 2개 이상이면 순환매 확인
  lagRatio: 0.4,     // 대장 상승률의 이 비율 이하 = 후발
  floorPct: -5,      // 이보다 많이 빠진 종목은 후발에서 제외 (섹터 외 악재 의심)
  minTurnoverM: 3,   // 최근 24h 거래대금 하한 (백만 USDT)
  minCorr: 0.4,      // 평소 대장과의 1h 수익률 상관 하한
  corrBars: 168,     // 상관 측정용 과거 봉 수 (이벤트 구간 제외)
  wakeH: 3,          // 거래량 깨어남 측정 구간
  emaLen: 50,        // 대장 추세 판단 EMA (1h)
  retraceWarn: 0.5,  // 대장 되돌림 경계선
  retraceBreak: 0.618, // 대장 되돌림 붕괴선
  timeStopH: 24,     // 후발이 이 시간 넘게 안 따라오면 시간손절 표시
  startPct: 5        // 구간 시작 대비 이 % 넘은 시점 = 출발 (알파·베타·감마 순서 판정)
};

function ema(values, len){
  const k = 2/(len+1); let e = values[0]; const out=[e];
  for(let i=1;i<values.length;i++){ e = values[i]*k + e*(1-k); out.push(e); }
  return out;
}

function pearson(a,b){
  const n=Math.min(a.length,b.length); if(n<20) return null;
  let sa=0,sb=0; for(let i=0;i<n;i++){sa+=a[i];sb+=b[i];}
  const ma=sa/n, mb=sb/n; let cov=0,va=0,vb=0;
  for(let i=0;i<n;i++){const da=a[i]-ma, db=b[i]-mb; cov+=da*db; va+=da*da; vb+=db*db;}
  return (va&&vb) ? cov/Math.sqrt(va*vb) : null;
}

// candles: 오래된 순 [{t,h,l,c,q}]  q = 봉별 거래대금(USDT)
function analyzeSymbol(candles, cfg){
  const n=candles.length, L=cfg.lookbackH;
  if(n < L+cfg.emaLen+2) return null;
  const closes=candles.map(k=>k.c);
  const c=closes[n-1], c0=closes[n-1-L];
  const r=c/c0-1;
  let hi=-Infinity; for(let i=n-L;i<n;i++) hi=Math.max(hi,candles[i].h);
  const retrace = hi>c0 ? (hi-c)/(hi-c0) : 0;
  const e=ema(closes,cfg.emaLen)[n-1];
  let turnover=0; for(let i=Math.max(0,n-24);i<n;i++) turnover+=candles[i].q;
  // 거래량 깨어남: 최근 wakeH봉 평균 대비, 이벤트 구간 이전 평균
  const W=cfg.wakeH; let recent=0; for(let i=n-W;i<n;i++) recent+=candles[i].q; recent/=W;
  let base=0,cnt=0; for(let i=Math.max(0,n-L-cfg.corrBars);i<n-L;i++){base+=candles[i].q;cnt++;}
  base = cnt? base/cnt : 0;
  const volWake = base>0 ? recent/base : null;
  const peak=hi/c0-1;
  // 출발 시점: 구간 안에서 처음으로 시작가 대비 startPct% 이상 오른 봉
  let startT=null;
  for(let i=n-L;i<n;i++){ if(candles[i].c/c0-1 >= (cfg.startPct??5)/100){ startT=candles[i].t; break; } }
  return {r, peak, c, hi, retrace, ema:e, aboveEma:c>=e, turnover, volWake, startT};
}

// 이벤트 구간(최근 L봉)을 빼고 평소 상관을 잰다
function corrToLeader(candA, candL, cfg){
  const mapL=new Map(candL.map(k=>[k.t,k.c]));
  const pairs=[]; for(const k of candA){ if(mapL.has(k.t)) pairs.push([k.c,mapL.get(k.t)]); }
  const end=pairs.length-cfg.lookbackH, start=Math.max(1,end-cfg.corrBars);
  if(end-start<20) return null;
  const ra=[],rl=[];
  for(let i=start;i<end;i++){ ra.push(Math.log(pairs[i][0]/pairs[i-1][0])); rl.push(Math.log(pairs[i][1]/pairs[i-1][1])); }
  return pearson(ra,rl);
}

function leaderState(a, cfg){
  if(!a.aboveEma || a.retrace>cfg.retraceBreak) return {key:"broke", label:"꺾임"};
  if(a.retrace>cfg.retraceWarn) return {key:"warn", label:"경계"};
  if(a.retrace>=0.25) return {key:"dip", label:"건강한 눌림"};
  return {key:"hold", label:"추세 유지"};
}

const ACTION = {
  hold:  "대장 추세 유지 중. 후발은 대장 눌림 나올 때까지 대기.",
  dip:   "대장 눌림에서 지지 유지. 후발 진입 구간.",
  warn:  "대장 되돌림 깊어짐. 신규 진입 보류, 보유분은 타이트하게.",
  broke: "대장 꺾임. 후발 보유분 정리."
};

// dataMap: base -> {symbol, candles}
function analyzeSector(name, members, dataMap, cfg, now, seen, listed){
  const rows=[], missing=[];
  for(const base of members){
    const d=dataMap[base];
    if(!d){ missing.push({base, why: listed && listed.has(base) ? "불러오기 실패" : "미상장"}); continue; }
    const a=analyzeSymbol(d.candles,cfg);
    if(!a){ missing.push({base, why:"신규·봉 부족"}); continue; }
    rows.push({base, symbol:d.symbol, ex:d.ex||"bybit", mk:d.mk||"fut", ...a});
  }
  if(!rows.length) return {name, rows, missing, status:"none", movers:0};
  rows.sort((x,y)=>y.r-x.r);
  // 대장 = 구간 내 고점 기준 최대 상승 (꺾여도 대장 자리 유지 → 꺾임 감지 가능)
  const leader=rows.reduce((a,b)=>b.peak>a.peak?b:a);
  const movers=rows.filter(x=>x.peak*100>=cfg.confirmPct).length;
  const status = movers>=2 ? "confirmed" : movers===1 ? "solo" : "none";
  const state = leaderState(leader,cfg);
  // 먼저 간 순서: 출발 시각 순 (같은 봉이면 고점 상승률 큰 쪽 먼저)
  const waves=rows.filter(x=>x.startT!=null).sort((a,b)=>a.startT-b.startT || b.peak-a.peak);
  waves.forEach((x,i)=>{ x.wave=i; });
  for(const x of rows){
    x.role = x===leader ? "lead" : (x.peak*100>=cfg.confirmPct ? "mover" : "rest");
    if(x===leader || x.role==="mover" || status!=="confirmed" || leader.peak<=0) continue;
    x.corr = corrToLeader(dataMap[x.base].candles, dataMap[leader.base].candles, cfg);
    const isLag = x.peak <= leader.peak*cfg.lagRatio && x.r*100 >= cfg.floorPct
      && x.turnover >= cfg.minTurnoverM*1e6 && x.corr!=null && x.corr>=cfg.minCorr;
    if(isLag){
      x.role="lag";
      const gap = 1 - Math.max(x.peak,0)/leader.peak;
      const wake = x.volWake==null ? 0 : Math.min(x.volWake/2,1);
      x.score = Math.round(100 * x.corr * gap * (0.5+0.5*wake));
      const key=name+"|"+x.base;
      if(seen && !seen[key]) seen[key]=now;
      x.waitH = seen ? (now-seen[key])/3.6e6 : 0;
      x.timeStop = x.waitH > cfg.timeStopH;
    }
  }
  if(seen){ // 후발 목록에서 빠진 종목은 대기시간 초기화
    const live=new Set(rows.filter(x=>x.role==="lag").map(x=>name+"|"+x.base));
    for(const k of Object.keys(seen)) if(k.startsWith(name+"|") && !live.has(k)) delete seen[k];
  }
  return {name, rows, missing, status, movers, leader, state, action:ACTION[state.key], waves};
}

// 거래소 티커가 프로젝트 티커와 다른 경우 (예: Binance는 Beam을 BEAMX로 상장)
const TICKER_ALIAS = { BEAM:["BEAMX"] };
function resolveSymbol(base, symbolSet){
  for(const b of [base, ...(TICKER_ALIAS[base]||[])])
    for(const p of ["","1000","10000","1000000"]){ const s=p+b+"USDT"; if(symbolSet.has(s)) return s; }
  return null;
}
/* CORE-END */

/* ---------- 네트워크 ---------- */
const EX = {
  bybit:{
    async symbols(){
      const j=await getJSON("https://api.bybit.com/v5/market/tickers?category=linear");
      return new Set(j.result.list.map(x=>x.symbol));
    },
    async klines(sym,limit){

function symIn(base, set, mk){
  if(mk==="spot") return [base,...(TICKER_ALIAS[base]||[])].map(b=>b+"USDT").find(x=>set.has(x))||null;

async function getJSON(url){
  const r=await fetch(url); if(!r.ok) throw new Error(`HTTP ${r.status}`);

async function pool(items,n,fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:n},async()=>{ while(i<items.length){const k=i++; try{out[k]=await fn(items[k]);}catch(e){out[k]=null;} } }));
  return out;
}

async function scan(){
  if(busy) return; busy=true; $("scan").disabled=true;
  try{
    setStatus("상장 목록 불러오는 중…");
    srcSets.clear();

    await srcSymbols("bybit","fut");
    const srcFail=[];
    await Promise.all(SOURCES.slice(1).map(([e,m])=>srcSymbols(e,m).catch(()=>{ srcFail.push(e+"|"+m); })));
    const binanceDown = srcFail.some(k=>k.startsWith("binance"));
    const bases=[...new Set(Object.values(sectors).flat())];
    // 종목별로 우선순위대로 상장된 소스 후보를 만든다
    const plan=bases.map(b=>({b, cands:SOURCES.map(([e,m])=>{ const set=srcSets.get(e+"|"+m); const sym=set&&symIn(b,set,m); return sym?{ex:e,mk:m,sym}:null; }).filter(Boolean)}))
      .filter(x=>x.cands.length);
    const limit=Math.min(1000, cfg.corrBars+cfg.lookbackH+cfg.emaLen+10);
    let done=0;
    const tryLoad=async c=>{ const k=await scanKlines(c.ex,c.mk,c.sym,limit); return (k&&k.length)?k:null; };
    const got=await pool(plan,6,async x=>{
      let r=null;
      for(const c of x.cands){ try{ const k=await tryLoad(c); if(k){ r={...c,candles:k}; break; } }catch(e){} }
      setStatus(`차트 불러오는 중… ${++done}/${plan.length}`); return r;
    });
    // 전부 실패한 종목은 한 번 더 천천히 재시도 (요청 한도·일시 오류 대비)
    for(let i=0;i<plan.length;i++){
      if(got[i]) continue;
      for(const c of plan[i].cands){ try{ await new Promise(r=>setTimeout(r,300)); const k=await tryLoad(c); if(k){ got[i]={...c,candles:k}; break; } }catch(e){} }
    }
    const dataMap={}; plan.forEach((x,i)=>{ if(got[i]) dataMap[x.b]={symbol:got[i].sym, ex:got[i].ex, mk:got[i].mk, candles:got[i].candles}; });
    const resolved=plan.map(x=>[x.b]);
    const seen=store.get("sbs_seen",{}), now=Date.now();
    const results=Object.entries(sectors).map(([n,m])=>analyzeSector(n,m,dataMap,cfg,now,seen,new Set(resolved.map(x=>x[0]))));
    store.set("sbs_seen",seen);
    if(binanceDown) results.forEach(r=>r.missing.forEach(m=>{ if(m.why==="미상장") m.why="Bybit에 없음 · Binance 접속 안 됨"; }));
    lastEx="bybit";
    const active=results.filter(s=>s.status!=="none").sort((a,b)=>(a.status===b.status?b.leader.peak-a.leader.peak:a.status==="confirmed"?-1:1));
    const quiet=results.filter(s=>s.status==="none");
    lastActive=active.concat(quiet);
    $("out").innerHTML = (active.length? active.map((s,i)=>renderSector(s,i)).join("") :
      `<p class="sub">${cfg.lookbackH}시간 동안 ${cfg.confirmPct}% 넘게 오른 섹터가 없습니다. 기준을 낮추거나 나중에 다시 스캔하세요.</p>`)
      + (quiet.length? `<details class="quiet"><summary>움직임 없는 섹터 ${quiet.length}개</summary>${quiet.map((s,k)=>{ const si=active.length+k;
        return `<div class="row">${s.name}${s.rows.length?` · 최고 <button class="sym" data-si="${si}" data-sym="${s.rows[0].symbol}">${s.rows[0].base}</button> ${pct(s.rows[0].r)}`:""}${missHtml(s,si)}</div>`; }).join("")}</details>`:"");
    const sub=Object.values(dataMap).filter(d=>!(d.ex==="bybit"&&d.mk==="fut")).length;
    const t=new Date(); setStatus(`Bybit 우선${sub?` (보조 소스 ${sub}개)`:""}${binanceDown?" · Binance 접속 안 됨":""} · ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")} 스캔 완료 · 종목 ${Object.keys(dataMap).length}개`);
  }catch(e){
    setStatus(`불러오기 실패: ${e.message}. 네트워크나 거래소 API 접속 상태를 확인하고 다시 스캔하세요.`,true);
  }finally{ busy=false; $("scan").disabled=false; }
}

function rmaSeries(src,len){ const out=new Array(src.length).fill(null); if(src.length<len) return out;
  let sum=0; for(let i=0;i<len;i++) sum+=src[i]; out[len-1]=sum/len; const a=1/len;
  for(let i=len;i<src.length;i++) out[i]=a*src[i]+(1-a)*out[i-1]; return out; }
function rsiAdvanced(r,len){ if(r==null) return null; const p=Math.pow(len/14,0.618)-1;
  const f=-Math.pow(Math.abs(Math.abs(r-50)-50),1+p)/Math.pow(50,p)+50; return r>50?f+50:-f+50; }
function rsiCandles(O,H,L,C,len){
  const n=C.length, rO=new Array(n).fill(null), rH=rO.slice(), rL=rO.slice(), rC=rO.slice();
  if(n<len+1) return {rO,rH,rL,rC};
  const u=new Array(n).fill(0), d=new Array(n).fill(0);
  for(let i=1;i<n;i++){ u[i]=Math.max(C[i]-C[i-1],0); d[i]=Math.max(C[i-1]-C[i],0); }
  const ru=rmaSeries(u,len), rd=rmaSeries(d,len), a=1/len;
  const R=(up,dn)=>dn===0?100:100-100/(1+up/dn);
  for(let i=1;i<n;i++){
    if(ru[i]==null||rd[i]==null||ru[i-1]==null||rd[i-1]==null) continue;
    const at=x=>[a*Math.max(x-C[i-1],0)+(1-a)*ru[i-1], a*Math.max(C[i-1]-x,0)+(1-a)*rd[i-1]];
    const [uh,dh]=at(H[i]), [ul,dl]=at(L[i]), [uo,do_]=at(O[i]);
    rH[i]=rsiAdvanced(R(uh,dh),len); rL[i]=rsiAdvanced(R(ul,dl),len); rO[i]=rsiAdvanced(R(uo,do_),len); rC[i]=rsiAdvanced(R(ru[i],rd[i]),len);
  }
  return {rO,rH,rL,rC};
}
function smaAt(arr,p,idx){ if(idx-p+1<0) return null; let s=0; for(let k=idx-p+1;k<=idx;k++){ if(arr[k]==null) return null; s+=arr[k]; } return s/p; }
function macdCalc(closes,fast=12,slow=26,sig=9){
  const n=closes.length;
  const em=(arr,p)=>{ const out=new Array(arr.length).fill(null); const k=2/(p+1); let prev=null;
    for(let i=0;i<arr.length;i++){ const v=arr[i]; if(v==null){out[i]=prev;continue;} prev=prev==null?v:v*k+prev*(1-k); out[i]=prev; } return out; };
  const ef=em(closes,fast), es=em(closes,slow), macd=new Array(n).fill(null);
  for(let i=0;i<n;i++) if(i>=slow-1) macd[i]=ef[i]-es[i];
  const sa=em(macd,sig), signal=new Array(n).fill(null), hist=new Array(n).fill(null);
  for(let i=0;i<n;i++) if(macd[i]!=null&&sa[i]!=null&&i>=slow+sig-2){ signal[i]=sa[i]; hist[i]=macd[i]-sa[i]; }
  return {macd,signal,hist};
}
function bandOf(src,t,period,mult){
  const up=[],mid=[],lo=[];
  for(let i=period-1;i<src.length;i++){
    let ok=true,sum=0; for(let k=i-period+1;k<=i;k++){ if(src[k]==null){ok=false;break;} sum+=src[k]; }
    if(!ok) continue; const m=sum/period; let v=0; for(let k=i-period+1;k<=i;k++){ const d=src[k]-m; v+=d*d; }
    const sd=Math.sqrt(v/period); up.push({time:t[i],value:m+mult*sd}); mid.push({time:t[i],value:m}); lo.push({time:t[i],value:m-mult*sd});
  }
  return {up,mid,lo};
}
function priceSMA(closes,t,p){ const out=[]; for(let i=p-1;i<closes.length;i++){ let s=0; for(let k=i-p+1;k<=i;k++) s+=closes[k]; out.push({time:t[i],value:s/p}); } return out; }
function priceFmtFor(p){ const a=Math.abs(+p)||1; const prec=Math.max(2,Math.min(10,4-Math.floor(Math.log10(a)))); return {type:'price',precision:prec,minMove:1/Math.pow(10,prec)}; }
const CANDLE={upColor:'#46cd8a',downColor:'#e0584f',wickUpColor:'#46cd8a',wickDownColor:'#e0584f',borderVisible:false};
function chartCommon(){
  return {
    layout:{background:{type:'solid',color:'transparent'},textColor:'#9AA6B8',fontSize:9},
    grid:{vertLines:{visible:false},horzLines:{visible:false}},
    timeScale:{borderColor:'#34425A',timeVisible:true,secondsVisible:false,rightOffset:10,barSpacing:6,minBarSpacing:4},
    rightPriceScale:{borderColor:'#34425A',scaleMargins:{top:0.12,bottom:0.12},minimumWidth:56},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#4d5a70',labelBackgroundColor:'#2c3a52'},horzLine:{color:'#4d5a70',labelBackgroundColor:'#2c3a52'}}
  };
}
function setBars(chart,n,total,el){
  const N=(n&&total>n)?n:total, gap=10;
  try{ const w=el.clientWidth||0; if(w>0) chart.applyOptions({timeScale:{minBarSpacing:Math.max(0.05,Math.min(6,w/(N+gap)))}}); }catch(e){}
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0,total-N),to:total-1+gap});
}

let charts=[], chartRO=null, chartSeq=0;
const cv={ex:"bybit", list:[], idx:0, si:0, tf:store.get("sbs_tf","15m"), bars:store.get("sbs_bars",100)};
function clearCharts(){ if(chartRO){ try{chartRO.disconnect();}catch(e){} chartRO=null; } charts.forEach(c=>{try{c.chart.remove();}catch(e){}}); charts=[]; }

async function buildPair(priceEl,rsiEl,it,tf,priceH,rsiH,visibleBars,seq){
  const cfg={rsiLen:14,smaF:9,smaS:20};
  let bars;
  try{ bars=await chartBars(it,tf); }catch(e){ if(seq===chartSeq) priceEl.innerHTML='<div class="chart-err">차트를 불러오지 못했습니다. ↻로 다시 시도하세요.</div>'; return; }
  if(seq!==chartSeq) return;
  if(!bars||bars.length<cfg.rsiLen+10){ priceEl.innerHTML='<div class="chart-err">데이터가 부족합니다.</div>'; return; }
  const t=bars.map(b=>Math.floor(b.t/1000)+KST), O=bars.map(b=>b.o), H=bars.map(b=>b.h), L=bars.map(b=>b.l), C=bars.map(b=>b.c);
  const priceData=bars.map((b,i)=>({time:t[i],open:O[i],high:H[i],low:L[i],close:C[i]}));
  const {rO,rH,rL,rC}=rsiCandles(O,H,L,C,cfg.rsiLen);
  const rsiData=[], s9=[], s20=[];
  for(let i=0;i<bars.length;i++){
    const a=smaAt(rC,cfg.smaF,i), b=smaAt(rC,cfg.smaS,i);
    if(a!=null) s9.push({time:t[i],value:a}); if(b!=null) s20.push({time:t[i],value:b});
    if(rO[i]==null||rC[i]==null||rH[i]==null||rL[i]==null){ rsiData.push({time:t[i]}); continue; }
    rsiData.push({time:t[i],open:rO[i],high:Math.max(rO[i],rH[i],rL[i],rC[i]),low:Math.min(rO[i],rH[i],rL[i],rC[i]),close:rC[i]});
  }
  const PXW=visibleBars||20;
  // 가격
  const pc=LightweightCharts.createChart(priceEl,{...chartCommon(),width:priceEl.clientWidth||320,height:priceH});
  pc.priceScale('right').applyOptions({scaleMargins:{top:0.04,bottom:0.32}});
  let pMin=Infinity,pMax=-Infinity; for(let i=Math.max(0,H.length-PXW);i<H.length;i++){ pMax=Math.max(pMax,H[i]); pMin=Math.min(pMin,L[i]); }
  const pPad=(pMax-pMin)*0.08||pMax*0.01||1;
  const pAuto=()=>({priceRange:{minValue:pMin-pPad,maxValue:pMax+pPad}});
  const pfmt=priceFmtFor(C[C.length-1]);
  const pcs=pc.addCandlestickSeries({...CANDLE,priceFormat:pfmt,autoscaleInfoProvider:pAuto}); pcs.setData(priceData);
  const pls={priceFormat:pfmt,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:pAuto};
  const bb=bandOf(C,t,20,2);
  pc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...pls}).setData(bb.up);
  pc.addLineSeries({color:'rgba(143,163,196,.72)',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,...pls}).setData(bb.mid);
  pc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...pls}).setData(bb.lo);
  pc.addLineSeries({color:'#5fd6c4',lineWidth:1,...pls}).setData(priceSMA(C,t,5));
  pc.addLineSeries({color:'#bf95f0',lineWidth:1,...pls}).setData(priceSMA(C,t,10));
  pc.addLineSeries({color:'#d77b38',lineWidth:1.5,...pls}).setData(priceSMA(C,t,20));
  [[50,'#c9a53d',1],[120,'#3aad64',1],[200,'#f1f4f8',2],[300,'#e05a8f',2]].forEach(([P,col,w])=>{
    if(C.length>=P) pc.addLineSeries({color:col,lineWidth:w,...pls,autoscaleInfoProvider:()=>null}).setData(priceSMA(C,t,P));
  });
  // MACD (가격 차트 하단 내부 분할)
  {
    const M=macdCalc(C), hD=[], mD=[], sD=[]; let fm=0, fs=0;
    for(let i=0;i<t.length;i++){
      if(M.macd[i]!=null) fm=M.macd[i]; if(M.signal[i]!=null) fs=M.signal[i];
      mD.push({time:t[i],value:fm}); sD.push({time:t[i],value:fs});
      const hv=M.hist[i]!=null?M.hist[i]:0; hD.push({time:t[i],value:hv,color:hv>=0?'rgba(70,205,138,.55)':'rgba(224,88,79,.55)'});
    }
    let lo=Infinity,hi=-Infinity; for(let i=Math.max(0,t.length-PXW);i<t.length;i++) [mD[i].value,sD[i].value,hD[i].value].forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);});
    const pad=(hi-lo)*0.15||1, mo={priceScaleId:'macd',priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:()=>({priceRange:{minValue:lo-pad,maxValue:hi+pad}})};
    const hs=pc.addHistogramSeries(mo); hs.setData(hD);
    pc.addLineSeries({...mo,color:'#5b9bd5',lineWidth:1}).setData(mD);
    pc.addLineSeries({...mo,color:'#f4a73c',lineWidth:1}).setData(sD);
    pc.priceScale('macd').applyOptions({scaleMargins:{top:0.72,bottom:0.02},visible:false});
    const xm=[]; for(let i=1;i<M.hist.length;i++){ const a=M.hist[i-1], b=M.hist[i]; if(a==null||b==null) continue;
      if(a<0&&b>=0) xm.push({time:t[i],position:'belowBar',color:'#3fd9c4',shape:'arrowUp',text:'GC'});
      else if(a>=0&&b<0) xm.push({time:t[i],position:'aboveBar',color:'#e0584f',shape:'arrowDown',text:'DC'}); }
    if(xm.length) hs.setMarkers(xm);
  }
  // RSI 캔들
  const rc=LightweightCharts.createChart(rsiEl,{...chartCommon(),width:rsiEl.clientWidth||320,height:rsiH});
  rc.priceScale('right').applyOptions({scaleMargins:{top:0.08,bottom:0.08}});
  let rMin=Infinity,rMax=-Infinity;
  for(let i=Math.max(0,rC.length-PXW);i<rC.length;i++){
    [rO[i],rH[i],rL[i],rC[i],smaAt(rC,cfg.smaF,i),smaAt(rC,cfg.smaS,i)].forEach(v=>{ if(v!=null){ rMin=Math.min(rMin,v); rMax=Math.max(rMax,v);} });
  }
  const rPad=Math.max(1.5,(rMax-rMin)*0.06), rAuto=isFinite(rMin)?()=>({priceRange:{minValue:rMin-rPad,maxValue:rMax+rPad}}):undefined;
  const rfmt={type:'price',precision:1,minMove:0.1};
  const rcs=rc.addCandlestickSeries({...CANDLE,priceFormat:rfmt,autoscaleInfoProvider:rAuto}); rcs.setData(rsiData);
  const rls={priceFormat:rfmt,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:rAuto};
  const rbb=bandOf(rC,t,cfg.smaS,2);
  rc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...rls}).setData(rbb.up);
  rc.addLineSeries({color:'rgba(88,106,134,.72)',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,...rls}).setData(rbb.mid);
  rc.addLineSeries({color:'#3fb0a0',lineWidth:1.5,...rls}).setData(rbb.lo);
  rc.addLineSeries({color:'#f4a73c',lineWidth:2,...rls}).setData(s9);
  rc.addLineSeries({color:'#5b9bd5',lineWidth:2,...rls}).setData(s20);
  [[70,'#3a4660'],[50,'#4f5b75'],[30,'#3a4660']].forEach(([v,c])=>rcs.createPriceLine({price:v,color:c,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}));
  // 과매수/과매도 세로 배경 + 30/50/70 선
  const mk=host=>{ const c=document.createElement('canvas'); c.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:1'; host.style.position='relative'; host.appendChild(c); return c; };
  const rOv=mk(rsiEl), pOv=mk(priceEl);
  function paint(canvas,host,chart,series,mode){
    const dpr=window.devicePixelRatio||1, W=host.clientWidth, Hh=host.clientHeight;
    canvas.width=W*dpr; canvas.height=Hh*dpr; canvas.style.width=W+'px'; canvas.style.height=Hh+'px';
    const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,Hh);
    const ts=chart.timeScale();
    const y70=mode==='rsi'?series.priceToCoordinate(70):null, y30=mode==='rsi'?series.priceToCoordinate(30):null;
    let pT=0,pB=Hh;
    if(mode==='price'){ let hi=-Infinity,lo=Infinity; for(let i=Math.max(0,t.length-20);i<t.length;i++){hi=Math.max(hi,H[i]);lo=Math.min(lo,L[i]);}
      const yh=series.priceToCoordinate(hi), yl=series.priceToCoordinate(lo); if(yh!=null&&yl!=null){pT=Math.max(0,yh-8);pB=Math.min(Hh,yl+8);} }
    let step=null; for(let i=1;i<t.length;i++){ const a=ts.timeToCoordinate(t[i-1]), b=ts.timeToCoordinate(t[i]); if(a!=null&&b!=null){step=Math.abs(b-a);break;} }
    const bw=step?step*0.9:4;
    for(let i=0;i<t.length;i++){ const cl=rC[i]; if(cl==null) continue; const x=ts.timeToCoordinate(t[i]); if(x==null) continue;
      if(cl>=70){ ctx.fillStyle='rgba(224,88,79,.14)'; if(mode==='rsi'&&y70!=null) ctx.fillRect(x-bw/2,0,bw,y70); else ctx.fillRect(x-bw/2,pT,bw,pB-pT); }
      if(cl<=30){ ctx.fillStyle='rgba(91,155,213,.16)'; if(mode==='rsi'&&y30!=null) ctx.fillRect(x-bw/2,y30,bw,Hh-y30); else ctx.fillRect(x-bw/2,pT,bw,pB-pT); } }
    if(mode==='rsi'){ const dl=(pr,c,w,dash)=>{ const y=series.priceToCoordinate(pr); if(y==null) return; ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=w; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.restore(); };
      dl(70,'rgba(224,88,79,.85)',1,[5,4]); dl(50,'rgba(244,167,60,.9)',1.4,[2,3]); dl(30,'rgba(91,155,213,.85)',1,[5,4]); }
  }
  const zones=()=>{ try{paint(rOv,rsiEl,rc,rcs,'rsi');}catch(e){} try{paint(pOv,priceEl,pc,pcs,'price');}catch(e){} };
  rc.timeScale().subscribeVisibleLogicalRangeChange(zones); pc.timeScale().subscribeVisibleLogicalRangeChange(zones); setTimeout(zones,30);
  setBars(pc,visibleBars,t.length,priceEl); setBars(rc,visibleBars,t.length,rsiEl);
  let lock=false; const a=pc.timeScale(), b=rc.timeScale();
  a.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r) return; lock=true; b.setVisibleLogicalRange(r); lock=false; });
  b.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r) return; lock=true; a.setVisibleLogicalRange(r); lock=false; });
  charts.push({chart:pc,el:priceEl},{chart:rc,el:rsiEl});
}

function chartInfo(it){
  const sec=lastActive[cv.si]; if(!sec) return "";
  if(it.miss){
    const why = it.miss==="미상장" ? "Bybit·Binance 선물/현물 모두 없음"
      : it.miss.startsWith("Bybit에 없음") ? "Bybit에 없고 Binance는 접속이 안 돼 확인 못 함"
      : it.miss==="불러오기 실패" ? "스캔 때 데이터 불러오기 실패 (다시 스캔하면 들어올 수 있음)" : "신규 상장이라 분석 봉 부족";
    return `<b>${sec.name}</b> · ${why} · 스캔 분석 제외${it.sym?` · ${srcName(it)} 차트`:""}`;
  }
  const x=sec.rows.find(r=>r.symbol===it.sym); if(!x) return "";
  const role={lead:"대장",mover:"동반 상승",lag:"후발 후보",rest:"미동조"}[x.role]||"";
  let h=`<b>${sec.name}</b> · ${role}${x.wave!=null?` · ${x.wave<3?WAVE[x.wave]:(x.wave+1)+"번째"} 출발 ${hhmm(x.startT)}`:""} · ${cfg.lookbackH}h ${pct(x.r)}`;
  if(x.role==="lag") h+=` · 점수 ${x.score} · 상관 ${x.corr.toFixed(2)}`;
  if(sec.status==="confirmed") h+=` · 대장 ${sec.leader.base} ${sec.state.label}`;
  return h;
}
async function renderChart(){
  const seq=++chartSeq; const body=$("cmBody"); clearCharts();
  const it=cv.list[cv.idx];
  $("cmPos").textContent=cv.list.length>1?`${cv.idx+1}/${cv.list.length}`:"";
  $("cmTitle").innerHTML=`${it.base}/USDT <small>${cv.tf.toUpperCase()}</small>`;
  refreshFavUI();
  $("cmInfo").innerHTML=chartInfo(it);
  if(!it.sym && !it.none){ body.innerHTML='<div class="chart-err" style="color:var(--dim)">다른 소스에서 찾는 중…</div>'; await resolveItem(it); if(seq!==chartSeq) return; }
  if(it.none){ body.innerHTML=`<div class="chart-err">${it.base}는 Bybit·Binance 선물과 현물 어디에도 USDT 마켓이 없습니다. (Binance는 VPN이 꺼져 있으면 확인되지 않아요)<br>티커가 거래소마다 다를 수 있으니 섹터 묶음에서 이름을 확인해 보세요.</div>`; $("cmInfo").innerHTML=chartInfo(it); return; }
  $("cmTitle").innerHTML=`${it.base}/USDT <small>${cv.tf.toUpperCase()} · ${srcName(it)}</small>`;
  refreshFavUI();
  $("cmInfo").innerHTML=chartInfo(it);
  document.querySelectorAll("#tfbar [data-tf]").forEach(e=>e.classList.toggle("on",e.dataset.tf===cv.tf));
  document.querySelectorAll("#tfbar [data-bars]").forEach(e=>e.classList.toggle("on",+e.dataset.bars===cv.bars));
  if(typeof LightweightCharts==="undefined"){ body.innerHTML='<div class="chart-err">차트 라이브러리를 불러오지 못했습니다. 인터넷 연결(unpkg.com)을 확인하세요.</div>'; return; }
  body.innerHTML=`<div class="pane-label">가격 · <span class="l5">5</span> <span class="l10">10</span> <span class="l20">20</span> <span class="l50">50</span> <span class="l120">120</span> <span class="l200">200</span> <span class="l300">300</span> · <span class="lb">BB</span> · <span class="lmd">MACD</span></div><div class="pchart"></div>
    <div class="pane-label">RSI 캔들 · <b>SMA9</b> / <i>SMA20</i> · <span class="lrb">BB(20,2)</span></div><div class="rchart"></div>`;
  const labels=[...body.querySelectorAll(".pane-label")].reduce((s,l)=>s+(l.offsetHeight||16)+5,0);
  const avail=Math.max(240,body.clientHeight-labels-12);
  const pH=Math.round(avail*0.58), rH=avail-pH;
  await buildPair(body.querySelector(".pchart"),body.querySelector(".rchart"),it,cv.tf,pH,rH,cv.bars,seq);
  if(seq!==chartSeq) return;
  chartRO=new ResizeObserver(()=>charts.forEach(({chart,el})=>{ try{ chart.applyOptions({width:el.clientWidth||320}); }catch(e){} }));
  chartRO.observe(body);
}
let lastFocus=null, histPushed=false;
function openChart(si,sym,base){
  const sec=lastActive[si]; if(!sec) return;
  cv.si=si;
  // 같은 섹터 안에서 넘겨보기: 분석된 종목 → 데이터 없음 종목 순
  cv.list=sec.rows.map(r=>({base:r.base, sym:r.symbol, ex:r.ex, mk:r.mk}))
    .concat(sec.missing.map(m=>({base:m.base, sym:null, miss:m.why})));
  cv.idx=Math.max(0, cv.list.findIndex(x=> sym ? x.sym===sym : x.base===base));
  lastFocus=document.activeElement;
  $("cm").classList.add("show"); document.body.style.overflow="hidden";
  if(!histPushed){ try{ history.pushState({chart:1},""); histPushed=true; }catch(e){} }
  $("cmClose").focus();
  renderChart();
}
function closeChart(fromPop){
  chartSeq++; clearCharts(); $("cmBody").innerHTML="";
  $("cm").classList.remove("show"); document.body.style.overflow="";
  if(histPushed){ histPushed=false; if(!fromPop) try{ history.back(); }catch(e){} }
  if(lastFocus) try{ lastFocus.focus(); }catch(e){}
}
function navChart(d){ if(cv.list.length<2) return; cv.idx=(cv.idx+d+cv.list.length)%cv.list.length; renderChart(); }
$("out").addEventListener("click",e=>{ const fb=e.target.closest("button.fav"); if(fb){ toggleFav(fb.dataset.fav); return; } const b=e.target.closest("button.sym"); if(b) openChart(+b.dataset.si,b.dataset.sym||null,b.dataset.base||null); });
$("cmClose").onclick=()=>closeChart(false);
$("cmPrev").onclick=()=>navChart(-1);
$("cmNext").onclick=()=>navChart(1);
$("cmReload").onclick=()=>renderChart();
$("cmFav").onclick=()=>{ const it=cv.list[cv.idx]; if(it&&it.sym&&it.mk==="fut") toggleFav(it.sym); };
$("tfbar").addEventListener("click",e=>{
  const s=e.target.closest("span"); if(!s) return;
  if(s.dataset.tf){ cv.tf=s.dataset.tf; store.set("sbs_tf",cv.tf); renderChart(); }
  else if(s.dataset.bars){ cv.bars=+s.dataset.bars; store.set("sbs_bars",cv.bars); renderChart(); }
});
window.addEventListener("popstate",()=>{ if($("cm").classList.contains("show")){ histPushed=false; closeChart(true); } });
document.addEventListener("keydown",e=>{
  if(!$("cm").classList.contains("show")) return;
  if(e.key==="Escape") closeChart(false);
  else if(e.key==="ArrowLeft") navChart(-1);
  else if(e.key==="ArrowRight") navChart(1);
});
// 좌우 스와이프 = 종목 이동 (차트 위 가로 드래그와 겹치지 않게 빠르고 큰 스와이프만)
{ let sx=0, sy=0, st=0;
  $("cm").addEventListener("touchstart",e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); },{passive:true});
  $("cm").addEventListener("touchend",e=>{ const p=e.changedTouches[0]; const dx=p.clientX-sx, dy=p.clientY-sy;
    if(Date.now()-st<400 && Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)*2) navChart(dx<0?1:-1); },{passive:true});
}

buildCfg(); showSectors();
