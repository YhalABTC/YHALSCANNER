<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YHAL JOURNAL">
<meta name="theme-color" content="#0b0906">
<link rel="manifest" href="manifest-journal.json">
<link rel="apple-touch-icon" href="icon-journal-180.png">
<title>YHAL JOURNAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  * { touch-action: manipulation; }   /* iOS 더블탭 줌 방지 */
  .pchart, .rchart, .mchart, canvas, .tv-lightweight-charts { touch-action: pinch-zoom !important; }   /* 차트는 핀치줌 허용 */
  html { -webkit-text-size-adjust: 100%; }
  :root{
    /* JOURNAL 팔레트 — 런처와 같은 골드/다크브라운 (RADAR의 네이비와 구분) */
    --bg:#0b0906; --surface:#151006; --surface-2:#100c07;
    --border:#3a2e14; --hair:#2a2110;
    --text:#efe4cb; --muted:#a6926a; --dim:#6e5d3d;
    --amber:#e3b64f; --amber-soft:rgba(227,182,79,.14);
    --accent:#e3b64f;
    --line:#3a2e14; --panel2:#151006; --ink:#efe4cb;
    --green:#46cd8a; --green-soft:rgba(70,205,138,.12);
    --up:#46cd8a; --down:#e0584f; --blue:#5b9bd5;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--disp)}
  body{min-height:100vh;padding:24px 18px 80px}
  .wrap{max-width:760px;margin:0 auto}   /* 폰 전용 레이아웃 — 넓은 화면에서도 폰 폭 유지 */

  /* header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--hair);margin-bottom:22px}
  .brand h1{font-size:23px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .brand h1 .tick{color:var(--amber)}
  .brand p{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.01em}
  .laststamp{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;white-space:nowrap}
  .searchbox{display:flex;gap:8px;margin-top:10px;width:100%}
  .searchbox input{flex:1;background:var(--panel2,#141b27);border:1px solid var(--line,#243044);
    color:var(--ink,#e8edf4);border-radius:8px;padding:10px 13px;font-size:13px;font-family:inherit;outline:none}
  .searchbox input:focus{border-color:var(--blue,#5b9bd5)}
  .searchbox input::placeholder{color:var(--dim);font-size:12px}
  .searchbox button{background:var(--blue,#5b9bd5);color:#0a0e16;border:none;border-radius:8px;
    padding:0 20px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .searchbox button:hover{filter:brightness(1.08)}
  .searchbox button.favadd{background:transparent;border:1px solid var(--line,#243044);color:#e8b84a;
    padding:0 14px;font-size:16px}
  .searchbox button.favadd:hover{background:rgba(232,184,74,.12);border-color:#e8b84a}
  .favhead{margin-top:8px}
  .fpx{display:flex;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
  .fpx .pxtf{display:inline-flex;align-items:center;gap:1px;background:var(--surface-2,#141b27);
    border:1px solid var(--border,#243044);border-radius:5px;padding:1px 6px;color:var(--dim)}
  .fpx .pxtf b{color:var(--text);margin-right:2px;font-size:10px}
  .pxlegend{font-size:10px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
  .fcond{display:flex;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
  .fcond .cndtf,.rcond .cndtf{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2,#141b27);
    border:1px solid var(--border,#243044);border-radius:5px;padding:1px 6px}
  .fcond .cndtf b,.rcond .cndtf b{color:var(--dim);margin-right:1px;font-size:10px;font-weight:600}
  .cl{font-weight:700;font-size:11px}
  .clB{color:#46cd8a} .clP{color:#9d7bd8} .clS{color:#5fd6c4} .clC{color:#3fb0a0} .clX{color:#e0584f}
  .rpx{display:inline-flex;gap:5px;margin-left:6px;font-family:var(--mono);font-size:10px;vertical-align:middle}
  .rpx .pxtf{display:inline-flex;align-items:center;gap:1px;background:var(--surface-2,#141b27);
    border:1px solid var(--border,#243044);border-radius:4px;padding:0 5px;color:var(--dim)}
  .rpx .pxtf b{color:var(--text);margin-right:2px;font-size:9px}
  .favhead h2{display:flex;align-items:center;gap:8px}
  .favcount{font-family:var(--mono);font-size:12px;color:var(--dim);font-weight:400}
  .favrefresh{background:var(--panel2,#141b27);border:1px solid var(--line,#243044);color:var(--ink,#e8edf4);
    border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .favrefresh:hover{border-color:var(--blue,#5b9bd5)}
  .favrefresh:disabled{opacity:.5;cursor:default}
  #favlist{margin-bottom:22px}
  .favempty{color:var(--dim);font-size:12.5px;padding:14px 2px;line-height:1.6}
  .favrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line,#243044);
    border-radius:9px;margin-bottom:7px;cursor:pointer;background:var(--panel2,#141b27);transition:border-color .12s}
  .favrow:hover{border-color:var(--blue,#5b9bd5)}
  .favrow .fsym{font-weight:700;font-size:14px;min-width:110px}
  .favrow .fsym .fp{color:var(--dim);font-weight:400;font-size:12px}
  .favrow .ftags{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;align-content:flex-start}
  .favrow .fcond{flex:1 1 0;min-width:0;align-content:flex-start}
  .favrow .fpx{flex:1 1 0;min-width:0;align-content:flex-start}
  .favrow .fcond,.favrow .fpx{border-left:1px solid var(--line,#243044);padding-left:10px}
  .favrow .fdel{flex:none}
  .favrow .ftags .pend{color:var(--dim);font-size:11px;font-family:var(--mono)}
  .favrow .fdel{background:transparent;border:none;color:var(--dim);font-size:16px;cursor:pointer;
    padding:2px 6px;border-radius:5px;line-height:1}
  .favrow .fdel:hover{color:#e0584f;background:rgba(224,88,79,.12)}
  .whaleinput{margin-bottom:12px}
  .whaleinput textarea{width:100%;min-height:84px;resize:vertical;background:var(--panel2,#141b27);
    border:1px solid var(--line,#243044);color:var(--ink,#e8edf4);border-radius:9px;padding:11px 13px;
    font-family:var(--mono);font-size:12px;line-height:1.5;outline:none}
  .whaleinput textarea:focus{border-color:#3fb0a0}
  .whaleinput textarea::placeholder{color:var(--dim);font-family:inherit}
  .whalebtns{display:flex;gap:8px;margin-top:8px}
  .whalebtns button{background:#3fb0a0;color:#0a0e16;border:none;border-radius:8px;padding:8px 18px;
    font-weight:700;font-size:13px;cursor:pointer}
  .whalebtns button.ghost{background:transparent;border:1px solid var(--line,#243044);color:var(--dim)}
  .whalebtns button.ghost:hover{border-color:#e0584f;color:#e0584f}
  .favrow .wmeta{font-size:11.5px;color:var(--muted,#7b899e);font-family:var(--mono);
    white-space:nowrap;margin-right:4px}
  .favrow .wmeta b{color:#e8b84a;font-weight:700}
  td.sym .favstar{cursor:pointer;color:#3a4456;font-size:14px;margin-right:7px;vertical-align:middle;
    transition:color .12s}
  td.sym .favstar:hover{color:#e8b84a}
  td.sym .favstar.on{color:#e8b84a}
  .reftag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
    border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:middle}
  .reftag.ref9{color:#e8a33c;background:rgba(232,163,60,.15)}
  .reftag.ref20{color:#5b9bd5;background:rgba(91,155,213,.15)}
  .reftag.refct{color:#3fb0a0;background:rgba(63,176,160,.16)}
  .reftag.refpx{color:#5b9bd5;background:rgba(91,155,213,.16)}
  .reftag.refpx20{color:#d77b38;background:rgba(215,123,56,.16)}   /* 가격 SMA20 리테 */
  .reftag.refpx5{color:#5fd6c4;background:rgba(95,214,196,.16)}    /* 가격 SMA5 리테 */
  .reftag.refboth{color:#0a0e16;background:#3fb0a0;font-weight:800}
  .reftag.refshort{color:#e0584f;background:rgba(224,88,79,.16)}
  .reftag.reflive{color:#0a0e16;background:#f0883c;font-weight:800;animation:livebadge 1.6s ease-in-out infinite}
  .mtag{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:800;border-radius:2px;padding:0 2px;margin-left:2px;vertical-align:middle;letter-spacing:.02em}
  .mtag.mMint{background:#3fd9c4}
  .mtag.mLime{background:#a3e635}
  .mtag.mPink{background:#f472b6}
  .mtag.mRed {background:#e0584f}
  .mtag.gc{color:#fff}
  .mtag.dc{color:#0a0e16}
  @keyframes livebadge{0%,100%{opacity:1}50%{opacity:.55}}
  .poslog{display:inline-flex;gap:3px;margin:0 2px}
  .posbtn{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);background:transparent;cursor:pointer;line-height:1.4;transition:all .15s}
  .posbtn.buy{color:#46cd8a;border-color:rgba(70,205,138,.4)}
  .posbtn.buy:hover{background:rgba(70,205,138,.18)}
  .posbtn.sell{color:#e0584f;border-color:rgba(224,88,79,.4)}
  .posbtn.sell:hover{background:rgba(224,88,79,.18)}
  .posbtn.done{background:#46cd8a;color:#0a0e16;border-color:#46cd8a}
  .journal-entry{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px}
  .journal-entry .jside{font-weight:700;padding:1px 6px;border-radius:4px;font-size:10px}
  .journal-entry .jside.buy{color:#46cd8a;background:rgba(70,205,138,.15)}
  .journal-entry .jside.sell{color:#e0584f;background:rgba(224,88,79,.15)}
  .journal-entry .jts{color:var(--dim);font-size:10px}
  .journal-entry .jx{margin-left:auto;cursor:pointer;color:var(--dim);padding:0 4px}
  .journal-entry .jx:hover{color:#e0584f}
  .posthoc-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 2px 10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .posthoc-form input,.posthoc-form select{font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
  .posthoc-form #phsym{width:120px}
  .posthoc-form #phprice{width:110px}
  .posthoc-form #phbtn{font-family:var(--mono);font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid rgba(91,155,213,.5);background:transparent;color:#5b9bd5;cursor:pointer}
  .posthoc-form #phbtn:hover{background:rgba(91,155,213,.15)}
  .posthoc-form #phstatus{font-size:11px;color:var(--dim)}
  .jbadge{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(143,163,196,.18);color:#8fa3c4;font-weight:600}
  .jpending{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(186,117,23,.16);color:#e8a33c}
  #chartMark.on{background:#46cd8a;color:#0a0e16;border-color:#46cd8a}
  .modal-body.marking .pchart{cursor:crosshair}
  #chartJournal{display:flex;flex-wrap:wrap;gap:8px;padding:8px 18px;border-top:1px solid var(--hair)}
  #chartJournal:empty{display:none}
  .cj-set{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;border:1.5px solid;font-family:var(--mono);font-size:11px}
  .cj-set.long{border-color:rgba(70,205,138,.55);background:rgba(70,205,138,.07)}
  .cj-set.short{border-color:rgba(224,88,79,.55);background:rgba(224,88,79,.07)}
  .cj-set .cj-dir{font-weight:700;font-size:10px;padding:1px 5px;border-radius:4px}
  .cj-set.long .cj-dir{color:#46cd8a;background:rgba(70,205,138,.16)}
  .cj-set.short .cj-dir{color:#e0584f;background:rgba(224,88,79,.16)}
  .cj-leg{display:inline-flex;align-items:center;gap:4px}
  .cj-set.long .cj-leg{color:#46cd8a}
  .cj-set.short .cj-leg{color:#e0584f}
  .cj-leg .cjt{color:var(--dim);font-size:10px}
  .cj-arrow{color:var(--dim);font-weight:700}
  .cj-open{color:#e8a33c;font-size:10px}
  .cj-leg .cjx{cursor:pointer;color:var(--dim);font-weight:700;margin-left:1px}
  .cj-leg .cjx:hover{color:#e0584f}

  /* condition chips */
  .conds{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:7px}
  .chip b{color:var(--text);font-weight:500}
  .chip .n{color:var(--amber);font-weight:700}

  /* control panel */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:18px;margin-bottom:20px}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}

  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px}
  .seg button{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);
    background:transparent;border:0;padding:7px 15px;border-radius:6px;cursor:pointer;transition:.12s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--amber);color:#0b0906}
  .seg.compact{flex-wrap:wrap}
  .seg.compact button{padding:7px 10px}
  .mode-row{margin-bottom:16px;display:grid;grid-template-columns:1fr;gap:10px}
  .scan-category{display:grid;grid-template-columns:108px minmax(0,1fr);align-items:center;gap:10px}
  .scan-category-label{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
    color:var(--dim);text-transform:uppercase;white-space:nowrap}
  .scan-category .seg{width:100%;display:flex;flex-wrap:wrap}
  .scan-rows{display:flex;flex-direction:column;gap:6px;min-width:0}   /* 한 카테고리에 여러 줄 */
  .scan-category .seg button{flex:1 1 auto;min-width:110px}
  .seg.modeswitch{padding:4px}
  .seg.modeswitch button{padding:9px 22px;font-size:14px}
  .seg.modeswitch button[data-sm="bear"].on{background:var(--blue);color:#0a0e16}
  .seg.modeswitch button[data-sm="pullback"].on{background:#9d7bd8;color:#0a0e16}
  .seg.modeswitch button[data-sm="support"].on{background:#46cd8a;color:#0a0e16}
  .seg.modeswitch button[data-sm="ctlong"].on{background:#3fb0a0;color:#0a0e16}
  .seg.modeswitch button[data-sm="short"].on{background:#e0584f;color:#0a0e16}
  .seg.modeswitch button[data-sm="resist"].on{background:#d4674a;color:#0a0e16}
  .seg.modeswitch button[data-sm="mania"].on{background:#f0883c;color:#0a0e16}
  .seg.modeswitch button[data-sm="oversold"].on{background:#4aa8d8;color:#0a0e16}
  .modeswitch-new button{background:linear-gradient(135deg,rgba(244,167,60,.16),rgba(224,88,79,.12));border-color:var(--amber)}
  #maproxtfseg button.above,#maproxrsi9 button.above{background:rgba(70,205,138,.22)!important;border-color:#46cd8a!important;color:#46cd8a!important}
  .seg.modeswitch button[data-sm="volx"].on{background:#f4c84b;color:#0a0e16}
  .seg.modeswitch button[data-sm="maprox"].on{background:#5b9bd5;color:#0a0e16}
  .seg.modeswitch button[data-sm="rsscan"].on{background:#ff9d4d;color:#0a0e16}
  .seg.modeswitch button[data-sm="seq"].on{background:#9d7bd8;color:#0a0e16}
  .field.disabled{opacity:.4;pointer-events:none}
  
  body[data-scan="maprox"] #pxretfield,
  body[data-scan="volx"]   #pxretfield,
  body[data-scan="rsscan"] #pxretfield,
  body[data-scan="seq"]    #pxretfield{display:none}

  .num{font-family:var(--mono);font-size:14px;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:8px;padding:8px 11px;width:108px;outline:none}
  .num:focus{border-color:var(--amber)}
  .suffix{position:relative}
  .suffix span{position:absolute;right:11px;top:50%;transform:translateY(-50%);
    font-family:var(--mono);font-size:11px;color:var(--dim);pointer-events:none}
  .suffix .num{padding-right:34px;width:118px}

  .adv{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .num.sm{width:74px}

  .scanbtn{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.01em;
    color:#1a1205;background:var(--amber);border:0;border-radius:9px;padding:13px 30px;cursor:pointer;
    transition:.14s;box-shadow:0 0 0 0 var(--amber-soft)}
  .scanbtn:hover:not(:disabled){box-shadow:0 4px 22px -6px var(--amber);transform:translateY(-1px)}
  .scanbtn:disabled{opacity:.5;cursor:not-allowed}

  /* progress / status */
  .status{display:flex;align-items:center;gap:14px;margin-bottom:14px;min-height:22px}
  .bar{flex:1;height:4px;background:var(--hair);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
  .stxt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .stxt b{color:var(--green)}

  /* results */
  .rs-split{display:flex;gap:12px;align-items:flex-start}
  .rs-left{flex:0 0 auto;width:min(420px,42%);min-width:0}
  .rs-right{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
  .rs-grp{display:flex;flex-direction:column;gap:4px}
  .rs-lab{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .rs-hint{font-size:10px;color:var(--dim)}
  .row-inrs{display:flex!important;flex-wrap:wrap;gap:8px 12px;margin:0!important;align-items:flex-end}
  .row-inrs .field{margin:0}
  .rs-info{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;line-height:1.5}
  /* 좁은 화면이면 (기기 판정과 무관하게) 차트 full width 세로 배치 */
  @media (max-width: 900px){
    .rs-split{flex-direction:column;gap:10px}
    .rs-left{width:100%!important;flex:1 1 auto!important}
    .rs-right{width:100%!important}
    .rs-grp{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px}
    .rs-lab{min-width:64px}
    #rschartwrap{width:100%}
  }
  body.mobile .rs-split{flex-direction:column;gap:10px}
  body.mobile .rs-left{width:100%!important;flex:1 1 auto}
  body.mobile .rs-right{width:100%}
  body.mobile .rs-grp{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px}
  body.mobile .rs-lab{min-width:64px}
  .chainbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .chain-lab{font-size:11px;color:var(--muted);font-weight:600}
  .chain-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--amber);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--text)}

<script>
let currentTF = '15m';   // 분석 TF — 사후기록 시 RSI/태그 역산에 쓰는 프레임
let chartTF = '15m';    // 차트 보기용 TF (단일 기본 15분)
let chartBars = 100;    // 단일 차트 가시 봉 수 (스케일창도 연동)
let quadMode = 'scalp';   // 복기 시트 TF 세트 — 저널은 5m·15m·1h·4h 고정 (UI 토글 없음)
function quadTfs(){ return quadMode==='swing' ? ['1h','4h','1d','1w'] : ['5m','15m','1h','4h']; }
const TF_MS = {'1m':6e4,'3m':18e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'4h':1.44e7,'1d':8.64e7,'1w':6.048e8};
let indShow = {5:true,10:true,20:true,50:true,120:true,200:true,300:true,bb:true,rbb:true,bb120:false};   // 이평/BB 표시 토글 (bb120=특수볼밴 기본꺼짐)
let exchange = 'bybit';
const CHART_TZ = 9*3600;   // 차트 표시용 KST 오프셋 (앱 전체 공통)
let lastFunding = {};      // 펀딩 캐시 — 차트 정보바 표시용

// ---- timeframe segment ----
document.getElementById('exseg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); exchange = b.dataset.ex;
});
// ---- Wilder RSI on an arbitrary source series ----
function rsi(src, len){
  const out = new Array(src.length).fill(null);
  if(src.length < len+1) return out;
  let g=0, l=0;
  for(let i=1;i<=len;i++){ const d=src[i]-src[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/len, al=l/len;
  out[len] = al===0 ? 100 : 100 - 100/(1+ag/al);
  for(let i=len+1;i<src.length;i++){
    const d=src[i]-src[i-1]; const gg=d>0?d:0, ll=d<0?-d:0;
    ag=(ag*(len-1)+gg)/len; al=(al*(len-1)+ll)/len;
    out[i] = al===0 ? 100 : (ag===0 ? 0 : 100 - 100/(1+ag/al));
  }
  return out;
}

// ── RSI 캔들 (TradingView 'RSI 캔든 엑드방' Pine 정확 포팅) ──
// 종가 기반 rma(ru/rd)를 공통 분모로 두고, 각 OHLC는 "직전 종가 대비 변화량"으로 산출.
// → low ≤ open,close ≤ high 정합성 보장. ad(RSI Advanced)는 50중심 비선형 변환(기본 ON).
const RSI_AD = true;
function rmaSeries(src, len){
  const out = new Array(src.length).fill(null);
  if(src.length < len) return out;
  let sum=0; for(let i=0;i<len;i++) sum+=src[i];
  out[len-1]=sum/len;
  const a=1/len;
  for(let i=len;i<src.length;i++) out[i]=a*src[i]+(1-a)*out[i-1];
  return out;
}
function rsiAdvanced(r, len){
  if(r==null) return null;
  const p = Math.pow(len/14, 0.618) - 1;
  const f = -Math.pow(Math.abs(Math.abs(r-50)-50), 1+p) / Math.pow(50, p) + 50;
  return r>50 ? f+50 : -f+50;
}
function rsiCandles(O, H, L, C, len, ad=RSI_AD){
  const n=C.length;
  const rO=new Array(n).fill(null), rH=new Array(n).fill(null), rL=new Array(n).fill(null), rC=new Array(n).fill(null);
  if(n < len+1) return {rO,rH,rL,rC};
  const u=new Array(n).fill(0), d=new Array(n).fill(0);
  for(let i=1;i<n;i++){ u[i]=Math.max(C[i]-C[i-1],0); d[i]=Math.max(C[i-1]-C[i],0); }
  const ru=rmaSeries(u,len), rd=rmaSeries(d,len);
  const a=1/len;
  for(let i=1;i<n;i++){
    if(ru[i]==null||rd[i]==null||ru[i-1]==null||rd[i-1]==null) continue;
    const ruh=a*Math.max(H[i]-C[i-1],0)+(1-a)*ru[i-1], rdh=a*Math.max(C[i-1]-H[i],0)+(1-a)*rd[i-1];
    const rul=a*Math.max(L[i]-C[i-1],0)+(1-a)*ru[i-1], rdl=a*Math.max(C[i-1]-L[i],0)+(1-a)*rd[i-1];
    const ruo=a*Math.max(O[i]-C[i-1],0)+(1-a)*ru[i-1], rdo=a*Math.max(C[i-1]-O[i],0)+(1-a)*rd[i-1];
    let rsih=rdh===0?100:100-100/(1+ruh/rdh);
    let rsil=rdl===0?100:100-100/(1+rul/rdl);
    let rsio=rdo===0?100:100-100/(1+ruo/rdo);
    let rsic=rd[i]===0?100:100-100/(1+ru[i]/rd[i]);
    if(ad){ rsih=rsiAdvanced(rsih,len); rsil=rsiAdvanced(rsil,len); rsio=rsiAdvanced(rsio,len); rsic=rsiAdvanced(rsic,len); }
    rO[i]=rsio; rH[i]=rsih; rL[i]=rsil; rC[i]=rsic;
  }
  return {rO,rH,rL,rC};
}
// 종가만 필요한 곳(태그 등): 종가 RSI + advanced 변환
function rsiCloseSeries(C, len, ad=RSI_AD){
  const base=rsi(C,len);
  return ad ? base.map(v=>v==null?null:rsiAdvanced(v,len)) : base;
}
function smaAt(arr, p, idx){
  if(idx-p+1 < 0) return null;
  let s=0;
  for(let k=idx-p+1;k<=idx;k++){ if(arr[k]==null) return null; s+=arr[k]; }
  return s/p;
}

// ── MACD (12,26,9) + 상태 태그 ──
function macdCalc(closes, fast=12, slow=26, sig=9){
  const n=closes.length;
  const ema=(arr,p)=>{ const out=new Array(arr.length).fill(null); const k=2/(p+1); let prev=null;
    for(let i=0;i<arr.length;i++){ const v=arr[i]; if(v==null){ out[i]=prev; continue; }
      prev = (prev==null) ? v : v*k + prev*(1-k); out[i]=prev; } return out; };
  const ef=ema(closes,fast), es=ema(closes,slow);
  const macd=new Array(n).fill(null);
  for(let i=0;i<n;i++){ if(ef[i]!=null&&es[i]!=null&&i>=slow-1) macd[i]=ef[i]-es[i]; }
  const sigArr=ema(macd.map(v=>v==null?null:v), sig);
  const signal=new Array(n).fill(null), hist=new Array(n).fill(null);
  for(let i=0;i<n;i++){ if(macd[i]!=null&&sigArr[i]!=null&&i>=slow+sig-2){ signal[i]=sigArr[i]; hist[i]=macd[i]-sigArr[i]; } }
  return {macd, signal, hist};
}
function macdStateAt(closes, idx){
  const M = macdCalc(closes);
  const m = M.macd[idx], h = M.hist[idx];
  if(m==null || h==null) return null;
  const cross = h >= 0 ? 'GC' : 'DC';
  const pos = m >= 0;
  const cls = pos ? (cross==='GC'?'mMint':'mLime') : (cross==='GC'?'mPink':'mRed');
  return { cross, pos, cls, macd:m, hist:h };
}

// ── 롱 셋업 5조건 공용 판정 (카드 매트릭스 + 차트 마커 공유) ──
// ---- exchange adapters (normalized klines: [{t(ms),o,h,l,c}] ascending) ----
const EX = {
  binance: {
    name: 'Binance',
    async universe(minVol){
      const base = 'https://fapi.binance.com';
      const [info, tickers] = await Promise.all([
        fetch(base+'/fapi/v1/exchangeInfo').then(r=>r.json()),
        fetch(base+'/fapi/v1/ticker/24hr').then(r=>r.json())
      ]);
      const vm = {};
      tickers.forEach(t=>{ vm[t.symbol] = parseFloat(t.quoteVolume)||0; });
      return info.symbols
        .filter(s=>s.quoteAsset==='USDT' && s.status==='TRADING' && s.contractType==='PERPETUAL')
        .map(s=>({symbol:s.symbol, vol:vm[s.symbol]||0}))
        .filter(s=>s.vol>=minVol).sort((a,b)=>b.vol-a.vol);
    },
    async klines(symbol, tf, limit){
      const iv = {'1m':'1m','3m':'3m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','4h':'4h','1d':'1d','1w':'1w','1M':'1M'}[tf];
      const raw = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${iv}&limit=${limit}`).then(r=>r.json());
      if(!Array.isArray(raw)) return null;
      return raw.map(k=>({t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4]}));

// ---- concurrency pool ----
async function pool(items, size, worker, onProgress){
  const out = []; let idx=0, done=0;
  async function run(){
    while(idx < items.length){
      const cur = items[idx++];
      const r = await worker(cur);
      if(r) out.push(r);
      done++; onProgress(done, items.length, out.length);
    }
  }
  await Promise.all(Array.from({length:Math.min(size,items.length)}, run));
  return out;
}

}

// ---- MTF RSI position tag ----
// 역배(s9<s20): RSI<s9 red · s9<RSI<s20 orange · else gray
// 정배(s9>s20): RSI>s9 green · s20<RSI<s9 yellow · else gray
function rsiTag(closes, rsiLen, smaF, smaS){
  const rC = rsiCloseSeries(closes, rsiLen);
  const i = closes.length - 1;
  const r = rC[i], s9 = smaAt(rC, smaF, i), s20 = smaAt(rC, smaS, i);
  if(r==null || s9==null || s20==null) return null;
  if(s9 < s20){
    if(r < s9)  return 'red';
    if(r < s20) return 'orange';
    return 'mint';      // 역배인데 RSI가 SMA20 위 (강한 반등)
  } else {
    if(r > s9)  return 'green';
    if(r > s20) return 'yellow';
    return 'pink';      // 정배인데 RSI가 SMA20 이하 (깊은 조정)
  }
}
const TAG_COLOR = {red:'#e0584f', orange:'#f0a83c', yellow:'#e8d44d', green:'#46cd8a', mint:'#5fd6c4', pink:'#e88bc0'};
// 좋은 순: 민트>초록>노랑>주황>빨강>핑크
const TAG_SCORE = {mint:6, green:5, yellow:4, orange:3, red:2, pink:1};
const TF_WEIGHT = {'5m':1, '15m':2, '1h':3, '1w':4};   // 스캘핑: 1w키=4h (상위 가중)
function tagScore(tags){
  if(!tags) return 0;
  if(tags.overheat){
    let s=0;
    ['5m','15m','1h','4h'].forEach(tf=>{ if(tags.over&&tags.over[tf]) s+=2*(TF_WEIGHT[tf]||TF_WEIGHT['1w']); if(tags.bbout&&tags.bbout[tf]) s+=1*(TF_WEIGHT[tf]||TF_WEIGHT['1w']); });
    return s;
  }
  // 색상(RSI 위치)점수 × TF 가중치, 1W 색상까지 합산
  return ['5m','15m','1h','1w'].reduce((s,tf)=>s + (TAG_SCORE[tags[tf]]||0) * (TF_WEIGHT[tf]||1), 0);
}
function tfTags(tags){
  if(!tags) return '';
  if(tags.overheat){
    const th = tags.th || 90;
    const col = tags.os ? '#4aa8d8' : (th>=90 ? '#e0584f' : '#f0883c');   // 30=파랑(과매도), 90=빨강(숏), 70=주황(과매수)
    let h='';
    const OL={'5m':'5M','15m':'15M','1h':'1H','4h':'4H'};
    ['5m','15m','1h','4h'].forEach(tf=>{ if(tags.over&&tags.over[tf]) h+=`<span class="tf-tag" style="color:${col};background:${col}22;border-color:${col}66">${OL[tf]} ${th}</span>`; });
    ['5m','15m','1h','4h'].forEach(tf=>{ if(tags.bbout&&tags.bbout[tf]) h+=`<span class="tf-tag" style="color:#bf95f0;background:#bf95f022;border-color:#bf95f066">${OL[tf]} BB</span>`; });
    return h;
  }
  const TFLAB = {'5m':'5M','15m':'15M','1h':'1H','1w':'4H'};   // 스캘핑: 1w키=4h표시
  let h = ['5m','15m','1h','1w'].map(tf=>{
    const c = tags[tf]; if(!c) return '';
    const col = TAG_COLOR[c];
    const hot = tags[tf+'_hot'] ? '🔥' : '';
    return `<span class="tf-tag" style="color:${col};background:${col}22;border-color:${col}66">${TFLAB[tf]}${hot}</span>`;
  }).join('');
  if(tags['1wpf']){
    const pass = tags['1wpf']==='pass';
    const col = pass ? '#46cd8a' : '#e0584f';
    h += `<span class="tf-tag" style="color:${col};background:${col}22;border-color:${col}66">4H ${pass?'P':'F'}</span>`;
  }
  if(tags['1wbb']){
    h += `<span class="tf-tag" style="color:#bf95f0;background:#bf95f022;border-color:#bf95f066">4H BBOUT</span>`;
  }
  return h;
}

function normalizeSymbol(raw){

  if(!s) return '';
  // 이미 USDT/USDC/USD 페어로 끝나면 그대로, 아니면 USDT 부착
  if(/(USDT|USDC|USD|PERP)$/.test(s)){
    s = s.replace(/PERP$/,'');
    if(!/USDT|USDC|USD$/.test(s)) s += 'USDT';
    return s;
  }
  return s + 'USDT';
}

// 진입 시점의 MTF RSI 태그 박제 (5m·15m·1h·4h) — endTime 지정으로 과거 시각도 역산
async function computeTags(symbol, cfg){
  const getK = (tf, lim) => cfg.endTime
    ? EX[cfg.exchange].klinesUntil(symbol, tf, cfg.endTime, lim)
    : EX[cfg.exchange].klines(symbol, tf, lim);
  const tags = {};
  const hotChk = (arr)=>{ const r=rsiCloseSeries(arr,cfg.rsiLen); const i=r.length-1; return r[i]!=null && r[i]>=70; };
  for(const tf of ['5m','15m','1h']){
    try{
      const tb = await getK(tf, 120);
      if(tb && tb.length > cfg.smaS + cfg.rsiLen + 2){
        tb.pop();                       // 진행봉 제외 (마감된 직전 봉 기준)
        const cl = tb.map(b=>b.c);
        tags[tf] = rsiTag(cl, cfg.rsiLen, cfg.smaF, cfg.smaS);
        if(hotChk(cl)) tags[tf+'_hot'] = true;
      }
    }catch(e){}
  }
  try{
    const wb = await getK('4h', 120);   // 태그 키 '1w' = 4H 슬롯 (앱 전체 공통 규약)
    if(wb && wb.length > cfg.rsiLen + 2){
      const ac = wb.map(b=>b.c), ah = wb.map(b=>b.h);
      const cur = ac.length - 1;
      if(cur >= 19){
        let sum=0; for(let k=cur-19;k<=cur;k++) sum+=ac[k];
        const m=sum/20; let v=0; for(let k=cur-19;k<=cur;k++){ const d=ac[k]-m; v+=d*d; }
        if(ah[cur] > m + 2*Math.sqrt(v/20)) tags['1wbb'] = true;
      }
      wb.pop();
      if(wb.length > cfg.smaS + cfg.rsiLen + 2){
        const wcl = wb.map(b=>b.c);
        tags['1w'] = rsiTag(wcl, cfg.rsiLen, cfg.smaF, cfg.smaS);
        if(hotChk(wcl)) tags['1w_hot'] = true;
      }
      const wrc = rsi(wb.map(b=>b.c), cfg.rsiLen);
      const wi = wrc.length - 1;
      if(wrc[wi]!=null) tags['1wpf'] = wrc[wi] >= 50 ? 'pass' : 'fail';
    }
  }catch(e){}
  return tags;
}

// 사후(소급) 기록: 과거 시각의 klines로 RSI/MTF 태그 역산, 수급은 보강대기
async function logPositionPostHoc(symbol, dir, side, dateMs, priceInput, priceTf){
  const cfg = {
    exchange,
    rsiLen: Math.max(2, +$('rsilen').value||14),
    smaF:   Math.max(1, +$('smaf').value||9),
    smaS:   Math.max(2, +$('smas').value||20),
  };
  const endMs = dateMs;
  let price = (priceInput!=null && priceInput!=='') ? +priceInput : null;
  let rowRsi = null, sma9=null, sma20=null;
  try{
    // 분석 TF(currentTF)의 그 시각 봉으로 RSI 캔들 역산
    const bars = await EX[exchange].klinesUntil(symbol, currentTF, endMs, 300);
    if(bars && bars.length > 25){
      const O=bars.map(b=>b.o), H=bars.map(b=>b.h), L=bars.map(b=>b.l), C=bars.map(b=>b.c);
      const {rC} = rsiCandles(O,H,L,C, cfg.rsiLen);
      const i = rC.length-1;
      rowRsi = rC[i];
      sma9 = smaAt(rC, cfg.smaF, i); sma20 = smaAt(rC, cfg.smaS, i);
    }
  }catch(e){}
  // 가격: 클릭 봉 종가가 안 넘어왔으면 클릭 패널 TF(priceTf) 봉으로 보강
  if(price==null){
    try{
      const ptf = priceTf || currentTF;
      const pb = await EX[exchange].klinesUntil(symbol, ptf, endMs, 5);
      if(pb && pb.length) price = pb[pb.length-1].c;
    }catch(e){}
  }
  // MTF 태그 역산 (endTime 지정)
  let tags = null;
  try{ tags = await computeTags(symbol, {...cfg, endTime:endMs}); }catch(e){}
  const entry = {
    id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
    ts: new Date(endMs).toISOString(),
    symbol, dir, side, price: (price!=null)?+price:null,
    mode: 'journal', tf: currentTF, exchange,
    tags,
    row: { rC: rowRsi, sma9, sma20, funding:null, gap:null, volat:null },
    posthoc: true,
    pending: { oi:true, cvd:true, funding:true }    // 실시간 수급 = 자체DB/코인글라스로 보강대기
  };
  positionLog.unshift(entry);
  savePositions(); renderPositions();
  return entry;
}

// ---- 📓 매매일지 ----
// 퍼센트 표기: 유효숫자 3자리까지 (0.0123 / 1.23 / 12.3 / 123)
function pct3(v){
  if(v==null || !isFinite(v)) return '–';
  const a = Math.abs(v);
  if(a >= 1000) return v.toFixed(0);
  return String(+v.toPrecision(3));
}
function holdSpan(ms){
  const m = Math.round(ms/60000);
  if(m < 60) return m+'분';
  if(m < 1440) return (m/60).toFixed(m%60?1:0)+'시간';
  return (m/1440).toFixed(m%1440?1:0)+'일';
}
// 방향별 진입→청산 페어링 (차트 마커·연결선과 동일 로직)
function pairTrades(list){
  const sets = [];
  ['long','short'].forEach(dir=>{
    const seq = list.filter(p=>p.dir===dir).slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    let open = null;
    seq.forEach(p=>{
      if(p.side==='entry'){ if(open) sets.push({dir,e:open,x:null}); open = p; }
      else { if(open){ sets.push({dir,e:open,x:p}); open = null; } else { sets.push({dir,e:null,x:p}); } }
    });
    if(open) sets.push({dir,e:open,x:null});
  });
  return sets;
}
function tradeSets(sym){ return pairTrades(positionLog.filter(p=>p.symbol===sym)); }
function allTradeSets(){
  const bySym = {};
  positionLog.forEach(p=>{ (bySym[p.symbol] = bySym[p.symbol] || []).push(p); });
  const out = [];
  Object.keys(bySym).forEach(sym=> pairTrades(bySym[sym]).forEach(s=> out.push(Object.assign({symbol:sym}, s))));
  return out.sort((a,b)=> new Date((b.x||b.e).ts) - new Date((a.x||a.e).ts));   // 최신 먼저
}
function setPnl(s){
  if(!s.e || !s.x || s.e.price==null || s.x.price==null || !s.e.price) return null;
  // 손익률은 항상 진입가 기준 (숏도 분모는 진입가) — 100→90 숏 = +10%
  return s.dir==='long' ? (s.x.price/s.e.price-1)*100 : (1 - s.x.price/s.e.price)*100;
}

// 지난 매매의 시점으로 창을 되돌려 4TF 시트를 뽑는다.
// 최신 봉만 불러오면 5m 같은 짧은 TF에서 진입·청산이 화면 밖으로 밀려나므로,
// klinesUntil(endTime)로 그 시각에서 끝나는 구간을 직접 가져온다.
async function exportTradeSheet(s){
  const eMs = s.e ? new Date(s.e.ts).getTime() : null;
  const xMs = s.x ? new Date(s.x.ts).getTime() : null;
  const fromMs = eMs || xMs;
  const lastMs = xMs || Date.now();
  const dur  = Math.max(5*60000, lastMs - fromMs);
  const pad  = Math.min(4*3600e3, Math.max(30*60000, dur*0.25));  // 청산 뒤 여유 (4시간 상한 — 5m 창을 낭비하지 않게)
  const end  = Math.min(Date.now(), lastMs + pad);
  const pnl  = setPnl(s);
  const sym  = s.symbol.replace('USDT','');
  const ex   = (s.e && s.e.exchange) || (s.x && s.x.exchange) || exchange;
  const dirK = s.dir === 'long' ? '롱' : '숏';
  const label = sym+'/USDT · '+dirK
    + (pnl!=null ? ' '+(pnl>=0?'+':'')+pct3(pnl)+'%' : ' 미청산')
    + ' · ' + fmtTs(s.e ? s.e.ts : s.x.ts).slice(5)
    + (s.x ? ' → '+fmtTs(s.x.ts).slice(11) : '') + ' KST';
  const fname = sym+'_'+(s.dir==='long'?'LONG':'SHORT')+'_'
    + fmtTs(s.e ? s.e.ts : s.x.ts).replace(/[: ]/g,'-');
  await exportMtfSheetPdf({symbol:s.symbol, ex, endTime:end, fromMs, label, fname});
}

const CHART_KLINE_LIMIT = 700;      // SMA300 + 최근 400봉 표시 여유 (거래소 1회 상한: Binance 1500 · Bybit 1000)
const CHART_CACHE_TTL_MS = 20_000;
const CHART_CACHE_MAX = 40;
const chartKlineCache = new Map();
const chartKlineInFlight = new Map();
const chartCacheVersion = new Map();
let chartRenderSeq = 0;
let chartInfoSeq = 0;

function chartCacheKey(ex, symbol, tf, limit){ return `${ex}|${symbol}|${tf}|${limit}`; }
function trimChartCache(){
  while(chartKlineCache.size > CHART_CACHE_MAX){
    const oldest = chartKlineCache.keys().next().value;
    chartKlineCache.delete(oldest);
  }
}
function invalidateChartCache(ex, symbol){
  for(const key of [...chartKlineCache.keys()]){
    const [kx,ks] = key.split('|');
    if(kx===ex && (!symbol || ks===symbol)) chartKlineCache.delete(key);
  }
  for(const key of [...chartKlineInFlight.keys()]){
    const [kx,ks] = key.split('|');
    if(kx===ex && (!symbol || ks===symbol)){
      chartCacheVersion.set(key, (chartCacheVersion.get(key)||0) + 1);
      chartKlineInFlight.delete(key);
    }
  }
}
// endTime을 주면 그 시각으로 끝나는 과거 구간을 가져온다 (매매일지 카드에서 지난 매매 시점 복원용)
async function loadChartBars(symbol, tf, limit=CHART_KLINE_LIMIT, {force=false, endTime=null, ex:exOpt=null}={}){
  const ex = exOpt || exchange;
  const key = chartCacheKey(ex, symbol, tf, limit) + (endTime ? '|@'+endTime : '');
  const now = Date.now();
  if(!force){
    const hit = chartKlineCache.get(key);
    if(hit && now-hit.ts < CHART_CACHE_TTL_MS){
      chartKlineCache.delete(key); chartKlineCache.set(key, hit); // LRU 갱신
      return hit.bars.slice();
    }
    if(chartKlineInFlight.has(key)) return (await chartKlineInFlight.get(key))?.slice?.() || null;
  }
  const version = (chartCacheVersion.get(key)||0) + (force ? 1 : 0);
  if(force) chartCacheVersion.set(key, version);
  else if(!chartCacheVersion.has(key)) chartCacheVersion.set(key, version);
  const requestVersion = chartCacheVersion.get(key);
  const request = (endTime ? EX[ex].klinesUntil(symbol, tf, endTime, limit) : EX[ex].klines(symbol, tf, limit)).then(bars=>{
    if(Array.isArray(bars) && chartCacheVersion.get(key)===requestVersion){
      chartKlineCache.delete(key);
      chartKlineCache.set(key, {ts:Date.now(), bars});
      trimChartCache();
    }
    return Array.isArray(bars) ? bars : null;
  }).finally(()=>{
    if(chartKlineInFlight.get(key)===request) chartKlineInFlight.delete(key);
  });
  if(!force) chartKlineInFlight.set(key, request);
  const bars = await request;
  return bars ? bars.slice() : null;
}

function nullableBollinger(src, t, period, mult){
  const up=[],mid=[],lo=[];
  for(let i=period-1;i<src.length;i++){
    let ok=true,sum=0;
    for(let k=i-period+1;k<=i;k++){ if(src[k]==null){ok=false;break;} sum+=src[k]; }
    if(!ok) continue;
    const m=sum/period; let v=0;
    for(let k=i-period+1;k<=i;k++){ const d=src[k]-m; v+=d*d; }
    const sd=Math.sqrt(v/period);
    up.push({time:t[i],value:m+mult*sd}); mid.push({time:t[i],value:m}); lo.push({time:t[i],value:m-mult*sd});
  }
  return {up,mid,lo};
}

function buildChartDataset(bars, cfg){
  const KST_OFFSET = 9 * 3600;
  const t = bars.map(b=>Math.floor(b.t/1000) + KST_OFFSET);
  const opens=bars.map(b=>b.o), highs=bars.map(b=>b.h), lows=bars.map(b=>b.l), closes=bars.map(b=>b.c);
  const priceData = bars.map((b,i)=>({time:t[i],open:opens[i],high:highs[i],low:lows[i],close:closes[i]}));
  const {rO,rH,rL,rC} = rsiCandles(opens, highs, lows, closes, cfg.rsiLen);
  const rsiData=[], sma9Data=[], sma20Data=[];
  for(let i=0;i<bars.length;i++){
    const s9=smaAt(rC,cfg.smaF,i), s20=smaAt(rC,cfg.smaS,i);
    if(s9!=null) sma9Data.push({time:t[i],value:s9});
    if(s20!=null) sma20Data.push({time:t[i],value:s20});
    if(rO[i]==null||rC[i]==null||rH[i]==null||rL[i]==null){ rsiData.push({time:t[i]}); continue; }
    rsiData.push({time:t[i],open:rO[i],high:Math.max(rO[i],rH[i],rL[i],rC[i]),low:Math.min(rO[i],rH[i],rL[i],rC[i]),close:rC[i]});
  }
  const priceSmas={};
  [5,10,20,50,120,200,300].forEach(p=>{ priceSmas[p]=priceSMA(closes,t,p); });
  return {
    t,opens,highs,lows,closes,priceData,rO,rH,rL,rC,rsiData,sma9Data,sma20Data,
    priceSmas, priceBB:bollinger(closes,t,20,2), priceBB120:bollinger(closes,t,120,1), rsiBB:nullableBollinger(rC,t,cfg.smaS,2),
    macd:macdCalc(closes,12,26,9)
  };
}

function priceSMA(closes, t, period){
  const out=[];
  for(let i=period-1;i<closes.length;i++){
    let s=0; for(let k=i-period+1;k<=i;k++) s+=closes[k];
    out.push({time:t[i], value:s/period});
  }
  return out;
}
function bollinger(closes, t, period, mult){
  const up=[],mid=[],lo=[];
  for(let i=period-1;i<closes.length;i++){
    let s=0; for(let k=i-period+1;k<=i;k++) s+=closes[k];
    const m=s/period;
    let v=0; for(let k=i-period+1;k<=i;k++){ const d=closes[k]-m; v+=d*d; }
    const sd=Math.sqrt(v/period);
    up.push({time:t[i],value:m+mult*sd});
    mid.push({time:t[i],value:m});
    lo.push({time:t[i],value:m-mult*sd});
  }
  return {up,mid,lo};
}

// 가격축 소수자리: 유효숫자 5자리 확보 (0.06 → 0.060000, 0.00004567 → 0.000045670)
function priceFmtFor(p){
  const a = Math.abs(+p) || 1;
  const prec = Math.max(2, Math.min(10, 4 - Math.floor(Math.log10(a))));
  return {type:'price', precision:prec, minMove:1/Math.pow(10,prec)};
}

// limit visible candles; both panels share the same range so candles line up
function setBars(chart, n, total, lastTime, gridTimes, widthEl){
  const ts = chart.timeScale();
  const N = (n && total>n) ? n : total;
  const gap = 10;   // 우측 여백 (캔들 계산 무관, 표시만)
  // lightweight-charts는 barSpacing을 minBarSpacing 아래로 못 내린다.
  // 패널 폭이 좁으면 minBarSpacing에 걸려 요청한 봉 수가 안 들어가므로(예: 380px에 200봉),
  // 요청 봉 수에 맞춰 minBarSpacing을 먼저 낮춰준다.
  try{
    const w = (widthEl && widthEl.clientWidth) || (chart.options && chart.options().width) || 0;
    if(w > 0){
      const need = Math.max(0.05, Math.min(6, w / (N + gap)));
      chart.applyOptions({ timeScale: { minBarSpacing: need } });
    }
  }catch(e){}
  ts.setVisibleLogicalRange({ from: Math.max(0, total - N), to: total - 1 + gap });
}

// build one price+RSI pair for a given timeframe
async function buildPair(priceEl, rsiEl, symbol, tf, priceH, rsiH, visibleBars, clickable, labelEl, options={}){
  const cfg = {
    rsiLen: Math.max(2,+$('rsilen').value||14),
    smaF:   Math.max(1,+$('smaf').value||9),
    smaS:   Math.max(2,+$('smas').value||20),
  };
  let bars;
  const klim = CHART_KLINE_LIMIT;
  try{ bars = await loadChartBars(symbol, tf, klim, {force:!!options.forceRefresh, endTime:options.endTime||null, ex:options.ex||null}); }
  catch(e){ if(options.renderId===chartRenderSeq && priceEl.isConnected) priceEl.innerHTML = `<div class="chart-err">로드 실패</div>`; return; }
  if(options.renderId!==chartRenderSeq || !priceEl.isConnected) return;
  if(!bars){ priceEl.innerHTML = `<div class="chart-err">데이터 없음</div>`; return; }
  // 데이터 짧으면 SMA 기간 자동 축소 (스캔과 동일)
  const cn = bars.length - 1;
  {
    const room = (cn - cfg.rsiLen) - 2;
    if(room < 5){ priceEl.innerHTML = `<div class="chart-err">데이터 부족</div>`; return; }
    if(cfg.smaS > room){
      cfg.smaS = Math.max(5, room);
      if(cfg.smaF >= cfg.smaS) cfg.smaF = Math.max(3, cfg.smaS - 3);
    }
  }

  const data = buildChartDataset(bars, cfg);
  const {t,opens,highs,lows,closes,priceData,rO,rH,rL,rC,rsiData,sma9Data,sma20Data,priceSmas,priceBB,priceBB120,rsiBB,macd} = data;
  // 패널 라벨에 현재 상태 태그 (RSI 색 + 가격 SMA5/20 ↑↓)
  if(labelEl){
    const i0c = bars.length - 2;
    const col = rsiTag(closes.slice(0, -1), cfg.rsiLen, cfg.smaF, cfg.smaS);
    const s5 = smaAt(closes,5,i0c), s20p = smaAt(closes,20,i0c);
    let badge = '';
    if(col) badge += `<span class="qtag" style="color:${TAG_COLOR[col]};border-color:${TAG_COLOR[col]}66;background:${TAG_COLOR[col]}22">RSI</span>`;
    if(s5!=null && s20p!=null && closes[i0c]!=null){
      const ar = u=> u ? '<span style="color:#46cd8a">↑</span>' : '<span style="color:#e0584f">↓</span>';
      badge += `<span class="qpx">${ar(closes[i0c]>=s5)}${ar(closes[i0c]>=s20p)}</span>`;
    }
    if(badge) labelEl.insertAdjacentHTML('beforeend', ' '+badge);
  }
  // price chart — 전체 높이는 구버전(priceH) 유지, 그 안에서 가격/MACD 분할 (화면 오버 방지)
  const pc = LightweightCharts.createChart(priceEl, {...chartCommon(), width:priceEl.clientWidth||320, height:priceH});
  pc.priceScale('right').applyOptions({scaleMargins:{top:0.04, bottom:0.32}});
  // 가격축을 최근 20봉 고저에 맞춤 → 최근 캔들이 위아래로 꽉 차게
  const PXW = (visibleBars && visibleBars>0) ? visibleBars : 20;   // 스케일창 = 가시 봉 수
  let pMin=Infinity, pMax=-Infinity;
  for(let i=Math.max(0,highs.length-PXW); i<highs.length; i++){ if(highs[i]>pMax)pMax=highs[i]; if(lows[i]<pMin)pMin=lows[i]; }
  const pPad = (pMax-pMin)*0.08 || (pMax*0.01) || 1;
  const priceAutoscale = (isFinite(pMin)&&isFinite(pMax)) ? () => ({priceRange:{minValue:pMin-pPad, maxValue:pMax+pPad}}) : undefined;
  const pfmt = priceFmtFor(closes[closes.length-1]);   // 저가 코인 가격축이 0.00으로 뭉개지지 않게
  const pcs = pc.addCandlestickSeries({...CANDLE, priceFormat:pfmt, autoscaleInfoProvider: priceAutoscale}); pcs.setData(priceData);
  const pls = {priceFormat:pfmt,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:priceAutoscale};
  // 가격 BB와 모든 이평은 항상 표시. 최근 20봉 가격축은 그대로 유지한다.
  const iShow = (typeof indShow!=='undefined') ? indShow : {5:1,10:1,20:1,50:1,120:1,200:1,bb:1,rbb:1};
  if(iShow.bb){
    pc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...pls}).setData(priceBB.up);
    pc.addLineSeries({color:'rgba(143,163,196,.72)',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,...pls}).setData(priceBB.mid);
    pc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...pls}).setData(priceBB.lo);
  }
  if(iShow.bb120 && priceBB120){   // 특수 볼밴 (120,1) — 기본 꺼짐
    pc.addLineSeries({color:'rgba(233,182,79,.75)',lineWidth:1,...pls,autoscaleInfoProvider:()=>null}).setData(priceBB120.up);
    pc.addLineSeries({color:'rgba(233,182,79,.45)',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,...pls,autoscaleInfoProvider:()=>null}).setData(priceBB120.mid);
    pc.addLineSeries({color:'rgba(233,182,79,.75)',lineWidth:1,...pls,autoscaleInfoProvider:()=>null}).setData(priceBB120.lo);
  }
  if(iShow[5])  pc.addLineSeries({color:'#5fd6c4',lineWidth:1,...pls}).setData(priceSmas[5]);
  if(iShow[10]) pc.addLineSeries({color:'#bf95f0',lineWidth:1,...pls}).setData(priceSmas[10]);
  if(iShow[20]) pc.addLineSeries({color:'#d77b38',lineWidth:1.5,...pls}).setData(priceSmas[20]);
  [[50,'#c9a53d',1],[120,'#3aad64',1],[200,'#f1f4f8',2],[300,'#e05a8f',2]].forEach(([P,col,w])=>{
    if(iShow[P] && closes.length >= P) pc.addLineSeries({color:col,lineWidth:w,...pls,autoscaleInfoProvider:()=>null}).setData(priceSmas[P]);
  });


  // ── MACD: 같은 차트 하단 스케일 (높이 추가 없이 내부 분할) ──
  {
    const M = macd;
    const hData=[], mData=[], sData=[];
    let fm=0, fs=0;
    for(let i=0;i<t.length;i++){
      if(M.macd[i]!=null) fm=M.macd[i];
      if(M.signal[i]!=null) fs=M.signal[i];
      mData.push({time:t[i], value: M.macd[i]!=null ? M.macd[i] : fm});
      sData.push({time:t[i], value: M.signal[i]!=null ? M.signal[i] : fs});
      const hv = M.hist[i]!=null ? M.hist[i] : 0;
      hData.push({time:t[i], value:hv, color: hv>=0 ? 'rgba(70,205,138,.55)' : 'rgba(224,88,79,.55)'});
    }
    let mMin=Infinity,mMax=-Infinity;
    for(let i=Math.max(0,t.length-PXW);i<t.length;i++){
      [mData[i]?.value,sData[i]?.value,hData[i]?.value].forEach(v=>{ if(v!=null){ if(v<mMin)mMin=v; if(v>mMax)mMax=v; } });
    }
    const mPad=(mMax-mMin)*0.15||1;
    const mScale=(isFinite(mMin)&&isFinite(mMax))?()=>({priceRange:{minValue:mMin-mPad,maxValue:mMax+mPad}}):undefined;
    const mopt={priceScaleId:'macd',priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:mScale};
    const histS = pc.addHistogramSeries({...mopt}); histS.setData(hData);
    pc.addLineSeries({...mopt,color:'#5b9bd5',lineWidth:1}).setData(mData);
    pc.addLineSeries({...mopt,color:'#f4a73c',lineWidth:1}).setData(sData);
    pc.priceScale('macd').applyOptions({scaleMargins:{top:0.72, bottom:0.02}, visible:false});
    const xMarks=[];
    for(let i=1;i<M.hist.length;i++){
      const a=M.hist[i-1], b=M.hist[i];
      if(a==null||b==null) continue;
      if(a<0 && b>=0) xMarks.push({time:t[i],position:'belowBar',color:'#3fd9c4',shape:'arrowUp',text:'GC'});
      else if(a>=0 && b<0) xMarks.push({time:t[i],position:'aboveBar',color:'#e0584f',shape:'arrowDown',text:'DC'});
    }
    if(xMarks.length) histS.setMarkers(xMarks);
  }

  // rsi chart
  const rc = LightweightCharts.createChart(rsiEl, {...chartCommon(), width:rsiEl.clientWidth||320, height:rsiH});
  rc.priceScale('right').applyOptions({scaleMargins:{top:0.08, bottom:0.08}});
  // RSI 캔들 실제 범위(+SMA9/20)에만 맞춰 오토스케일 — 70/50/30 가이드라인은 스케일에서 제외
  // RSI 캔들도 최근 20봉 범위에만 맞춰 오토스케일 (+SMA9/20)
  let rMin=Infinity, rMax=-Infinity;
  for(let i=Math.max(0,rC.length-PXW);i<rC.length;i++){
    [rO[i],rH[i],rL[i],rC[i]].forEach(v=>{ if(v!=null){ if(v<rMin)rMin=v; if(v>rMax)rMax=v; } });
  }
  for(let i=Math.max(0,rC.length-PXW);i<rC.length;i++){
    const s9=smaAt(rC,cfg.smaF,i), s20=smaAt(rC,cfg.smaS,i);
    if(s9!=null){ if(s9<rMin)rMin=s9; if(s9>rMax)rMax=s9; }
    if(s20!=null){ if(s20<rMin)rMin=s20; if(s20>rMax)rMax=s20; }
  }
  const rPad = Math.max(1.5, (rMax-rMin)*0.06);
  const rsiAutoscale = (isFinite(rMin)&&isFinite(rMax)) ? () => ({priceRange:{minValue:rMin-rPad, maxValue:rMax+rPad}}) : undefined;
  const rfmt = {type:'price', precision:1, minMove:0.1};   // RSI=퍼센트값 → 70.5 (유효숫자 3자리)
  const rcs = rc.addCandlestickSeries({...CANDLE, priceFormat:rfmt, autoscaleInfoProvider: rsiAutoscale}); rcs.setData(rsiData);
  const rls = {priceFormat:rfmt,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:rsiAutoscale};
  // ── 과매수(70↑)/과매도(30↓) 세로 배경 + 30/50/70 기준선 (종가 기준) ──
  const rsiOverlay = document.createElement('canvas');
  rsiOverlay.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:1';
  rsiEl.style.position = 'relative'; rsiEl.appendChild(rsiOverlay);
  const priceOverlay = document.createElement('canvas');
  priceOverlay.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:1';
  priceEl.style.position = 'relative'; priceEl.appendChild(priceOverlay);
  function paintZones(canvas, host, chart, series, mode){
    const dpr = window.devicePixelRatio || 1;
    const W = host.clientWidth, H = host.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr; canvas.style.width = W+'px'; canvas.style.height = H+'px';
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const ts = chart.timeScale();
    const y70 = (mode==='rsi'&&series) ? series.priceToCoordinate(70) : null;
    const y30 = (mode==='rsi'&&series) ? series.priceToCoordinate(30) : null;
    // 가격 패널: 캔들 영역만 칠하도록 상하 경계 (MACD 영역 제외)
    let pTop=0, pBot=H;
    if(mode==='price' && series){
      let hi=-Infinity, lo=Infinity;
      for(let i=Math.max(0,t.length-20);i<t.length;i++){ if(highs[i]>hi)hi=highs[i]; if(lows[i]<lo)lo=lows[i]; }
      const yh=series.priceToCoordinate(hi), yl=series.priceToCoordinate(lo);
      if(yh!=null&&yl!=null){ pTop=Math.max(0,yh-8); pBot=Math.min(H,yl+8); }
    }
    let step=null;
    for(let i=1;i<t.length;i++){ const a=ts.timeToCoordinate(t[i-1]), b=ts.timeToCoordinate(t[i]); if(a!=null&&b!=null){ step=Math.abs(b-a); break; } }
    const bw = step ? step*0.9 : 4;
    for(let i=0;i<t.length;i++){
      const cl = rC[i]; if(cl==null) continue;
      const x = ts.timeToCoordinate(t[i]); if(x==null) continue;
      if(cl>=70){ ctx.fillStyle='rgba(224,88,79,.14)';
        if(mode==='rsi'&&y70!=null) ctx.fillRect(x-bw/2,0,bw,y70); else ctx.fillRect(x-bw/2,pTop,bw,pBot-pTop); }
      if(cl<=30){ ctx.fillStyle='rgba(91,155,213,.16)';
        if(mode==='rsi'&&y30!=null) ctx.fillRect(x-bw/2,y30,bw,H-y30); else ctx.fillRect(x-bw/2,pTop,bw,pBot-pTop); }
    }
    if(mode==='rsi'&&series){
      const dl=(pr,c,w,dash)=>{ const y=series.priceToCoordinate(pr); if(y==null)return;
        ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=w; if(dash)ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.restore(); };
      dl(70,'rgba(224,88,79,.85)',1,[5,4]); dl(50,'rgba(244,167,60,.9)',1.4,[2,3]); dl(30,'rgba(91,155,213,.85)',1,[5,4]);
    }
  }
  function drawRsiZones(){
    try{ paintZones(rsiOverlay, rsiEl, rc, rcs, 'rsi'); }catch(e){}
    try{ paintZones(priceOverlay, priceEl, pc, pcs, 'price'); }catch(e){}
  }
  rc.timeScale().subscribeVisibleLogicalRangeChange(drawRsiZones);
  pc.timeScale().subscribeVisibleLogicalRangeChange(drawRsiZones);
  setTimeout(drawRsiZones, 30);
  // RSI BB(20,2)는 항상 표시한다.
  if((typeof indShow!=='undefined'?indShow.rbb:true)){
    rc.addLineSeries({color:'rgba(88,106,134,.82)',lineWidth:1,...rls}).setData(rsiBB.up);
    rc.addLineSeries({color:'rgba(88,106,134,.72)',lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,...rls}).setData(rsiBB.mid);
    rc.addLineSeries({color:'#3fb0a0',lineWidth:1.5,...rls}).setData(rsiBB.lo);
  }
  rc.addLineSeries({color:'#f4a73c',lineWidth:2,...rls}).setData(sma9Data);
  rc.addLineSeries({color:'#5b9bd5',lineWidth:2,...rls}).setData(sma20Data);
  // 매매 마커(진입/청산) + 둘을 잇는 진입선
  const KST = 9 * 3600;
  // 매매 세트(진입→청산) 페어링: 방향별로 시간순 정렬해 진입-청산 짝짓기
  const symPos = positionLog.filter(p=>p.symbol===symbol)
    .slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const toKt = p => Math.floor(new Date(p.ts).getTime()/1000) + KST;
  const posMarks = [];
  const trades = [];           // {dir, e:{kt,price}, x:{kt,price}|null, n}
  ['long','short'].forEach(dir=>{
    const seq = symPos.filter(p=>p.dir===dir);
    let open = null, n = 0;
    seq.forEach(p=>{
      if(p.side==='entry'){ if(open){ trades.push({dir,e:open,x:null,n:++n}); } open = {kt:toKt(p), price:p.price}; }
      else { if(open){ trades.push({dir,e:open,x:{kt:toKt(p),price:p.price},n:++n}); open=null; } else { trades.push({dir,e:null,x:{kt:toKt(p),price:p.price},n:++n}); } }
    });
    if(open) trades.push({dir,e:open,x:null,n:++n});
  });
  // 봉 몸통 중심값(oc2) 조회 — 그 시각 봉의 (시가+종가)/2
  const midAt = kt => { const idx = t.indexOf(kt); return idx>=0 ? (opens[idx]+closes[idx])/2 : null; };
  // 세트 연결선(진입↔청산) — 흰색, 캔들 중심끼리
  trades.forEach(tr=>{
    if(tr.e && tr.x){
      const y1 = midAt(tr.e.kt), y2 = midAt(tr.x.kt);
      if(y1==null || y2==null) return;
      const ln = pc.addLineSeries({color:'#ffffff', lineWidth:2, lineStyle:LightweightCharts.LineStyle.Dashed,
        priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      ln.setData([{time:tr.e.kt,value:y1},{time:tr.x.kt,value:y2}]);
    }
  });
  // 봉 마커: 세트번호로 진입/청산이 한 쌍임을 표시 (롱 초록 / 숏 빨강)
  symPos.forEach(p=>{
    const long = p.dir==='long', entry = p.side==='entry';
    posMarks.push({ time: toKt(p),
      position: entry ? 'belowBar' : 'aboveBar',
      color: long ? '#46cd8a' : '#e0584f',
      shape: entry ? 'arrowUp' : 'arrowDown',
      text: (long?'L':'S') + (entry?'진입':'청산') });
  });
  pcs.setMarkers(posMarks.slice().sort((a,b)=>a.time-b.time));
  // 봉 클릭 → 사후 매매표시 (clickable 패널만, markMode일 때만)
  if(clickable){
    pc.subscribeClick(param=>{
      if(!markMode || param.time==null) return;
      const utcMs = (param.time - KST) * 1000;
      const side = nextSide(symbol, markDir);
      // 클릭한 바로 그 봉(이 패널 TF)의 종가를 직접 가격으로 — currentTF 봉과 안 섞이게
      const ci = t.indexOf(param.time);
      const clickPrice = (ci>=0) ? closes[ci] : null;
      logPositionPostHoc(symbol, markDir, side, utcMs, clickPrice, tf).then(()=>renderChartView());
    });
  }
  [[70,'#3a2e14'],[50,'#51401c'],[30,'#3a2e14']].forEach(([v,c])=>{
    rcs.createPriceLine({price:v,color:c,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true});
  });

  // both panels share the identical time grid (t) and last time -> candles align
  // PC·모바일 동일 경로 — setBars가 패널 폭에 맞춰 minBarSpacing까지 조정
  {
    const N = visibleBars || (typeof IS_MOBILE!=='undefined' && IS_MOBILE ? 55 : 100);
    setBars(pc, N, t.length, t[t.length-1], t, priceEl);
    setBars(rc, N, t.length, t[t.length-1], t, rsiEl);
  }
  let lock=false;
  const a=pc.timeScale(), b2=rc.timeScale();
  a.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r)return; lock=true; b2.setVisibleLogicalRange(r); lock=false; });
  b2.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r)return; lock=true; a.setVisibleLogicalRange(r); lock=false; });

  charts.push({chart:pc, el:priceEl}, {chart:rc, el:rsiEl});
}

function clearCharts(){
  chartObservers.forEach(o=>{ try{o.disconnect();}catch(e){} }); chartObservers=[];
  charts.forEach(({chart})=>{ try{chart.remove();}catch(e){} }); charts=[];
}

async function renderChartView({forceRefresh=false}={}){
  const renderId = ++chartRenderSeq;
  const body = $('chartBody');
  clearCharts();
  if(typeof LightweightCharts === 'undefined'){
    body.innerHTML = `<div class="chart-err">차트 라이브러리를 불러오지 못했어요.<br>인터넷 연결(unpkg.com 접근)을 확인하세요.</div>`;
    return;
  }
  const tfbarEl = $('tfbar'); if(tfbarEl) tfbarEl.style.display = (chartView==='single') ? 'flex' : 'none';
  const qmEl = $('quadmodeseg'); if(qmEl) qmEl.style.display = (chartView==='quad') ? '' : 'none';
  if(chartView === 'single'){
    body.className = 'modal-body';
    const tfb = IS_MOBILE ? `<span class="tfnow">${chartTF.toUpperCase()}</span> ` : '';
    body.innerHTML = `
      <div class="chart-pane"><div class="pane-label">${tfb}가격 · <span class="l5">5</span> <span class="l10">10</span> <span class="l20">20</span> <span class="l50">50</span> <span class="l120">120</span> <span class="l200">200</span> <span class="l300">300</span> · <span class="lb">BB</span> · <span class="lmd">MACD</span></div><div class="pchart"></div></div>
      <div class="chart-pane"><div class="pane-label">${tfb}RSI 캔들 · <b>SMA9</b> / <i>SMA20</i> · <span class="lrb">BB(20,2)</span></div><div class="rchart"></div></div>`;
    let pH, rH;
    if(IS_MOBILE){
      // 뷰포트에서 헤더 영역(제목바·TF바·힌트·정보바)과 패딩을 빼서 남는 공간을 가격:RSI=58:42로 분배
      const card = body.closest('.modal-card');
      let chrome = 0;
      if(card){
        ['.modal-head','.tfbar','.mobi-hint','.chartinfo'].forEach(sel=>{
          const el = card.querySelector(sel); if(el) chrome += el.offsetHeight;
        });
        chrome += parseFloat(getComputedStyle(card).paddingTop)||0;   // safe-area + 상단여백
      }
      const labels = body.querySelectorAll('.pane-label');
      let labelH = 0; labels.forEach(l=>{ labelH += l.offsetHeight||18; });
      const panes = body.querySelectorAll('.chart-pane');
      let marginH = 0; panes.forEach(p=>{ marginH += parseFloat(getComputedStyle(p).marginBottom)||0; });
      const bs = getComputedStyle(body);
      const padH = (parseFloat(bs.paddingTop)||0) + (parseFloat(bs.paddingBottom)||0);
      const vp = window.innerHeight || mobileChartH || 700;
      const avail = Math.max(240, vp - chrome - padH - labelH - marginH - 6);
      pH = Math.round(avail * 0.58);
      rH = avail - pH;
    } else { pH = 248; rH = 200; }
    await buildPair(body.querySelector('.pchart'), body.querySelector('.rchart'), currentChartSymbol, chartTF, pH, rH, chartBars, true, body.querySelectorAll('.pane-label')[1], {renderId,forceRefresh});
    if(renderId!==chartRenderSeq) return;
    syncTfBar();
  }else{
    body.className = 'modal-body quad';
    const tfs = quadTfs();
    body.innerHTML = tfs.map(tf=>`
      <div class="quad-cell">
        <div class="quad-label">${tf.toUpperCase()}</div>
        <div class="pane-label">가격 · <span class="l5">5</span> <span class="l10">10</span> <span class="l20">20</span> <span class="l50">50</span> <span class="l120">120</span> <span class="l200">200</span> <span class="l300">300</span> · <span class="lb">BB</span> · <span class="lmd">MACD</span></div><div class="pchart"></div>
        <div class="pane-label">RSI · <b>9</b>/<i>20</i> · <span class="lrb">BB</span></div><div class="rchart"></div>
      </div>`).join('');
    const cells = [...body.querySelectorAll('.quad-cell')];
    await Promise.all(tfs.map((tf,k)=>
      buildPair(cells[k].querySelector('.pchart'), cells[k].querySelector('.rchart'), currentChartSymbol, tf, 150, 120, 50, true, null, {renderId,forceRefresh})
    ));
    if(renderId!==chartRenderSeq) return;
  }
  if(renderId!==chartRenderSeq || !body.isConnected) return;
  const ro = new ResizeObserver(()=>{ charts.forEach(({chart,el})=>{ try{
    chart.applyOptions({width:el.clientWidth||320});
    // 폭이 바뀌면 minBarSpacing 상한도 다시 계산해야 요청한 봉 수가 유지됨
    const r = chart.timeScale().getVisibleLogicalRange();
    if(r){ const span = Math.max(1, r.to - r.from);
      chart.applyOptions({timeScale:{minBarSpacing: Math.max(0.05, Math.min(6, (el.clientWidth||320)/span))}});
      chart.timeScale().setVisibleLogicalRange(r); }
  }catch(e){} }); });
  ro.observe(body); chartObservers.push(ro);
  if(markMode) body.classList.add('marking');
  renderChartJournal();
}

// 차트 모달: 현재 종목 매매를 세트(진입→청산) 박스로 묶어 표시 + ✕ 삭제
function renderChartJournal(){
  const el = $('chartJournal'); if(!el) return;
  const sym = currentChartSymbol;
  const all = positionLog.filter(p=>p.symbol===sym).slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  // 방향별 진입→청산 페어링 (차트 연결선과 동일 로직)
  const sets = [];
  ['long','short'].forEach(dir=>{
    const seq = all.filter(p=>p.dir===dir);
    let open=null;
    seq.forEach(p=>{
      if(p.side==='entry'){ if(open) sets.push({dir,e:open,x:null}); open=p; }
      else { if(open){ sets.push({dir,e:open,x:p}); open=null; } else { sets.push({dir,e:null,x:p}); } }
    });
    if(open) sets.push({dir,e:open,x:null});
  });
  sets.sort((a,b)=> new Date((a.e||a.x).ts) - new Date((b.e||b.x).ts));
  const chip = p => {
    const long = p.dir==='long';
    const side = p.side==='exit' ? '청산' : '진입';
    const px = p.price!=null ? ' '+fmtPrice(p.price) : '';
    return `<span class="cj-leg ${long?'long':'short'}">${side}${px} <span class="cjt">${fmtTs(p.ts).slice(5)}</span><span class="cjx" data-cjdel="${p.id}" title="삭제">✕</span></span>`;
  };
  el.innerHTML = sets.map(s=>{
    const long = s.dir==='long';
    const cls = long?'long':'short';
    const arrow = (s.e && s.x) ? `<span class="cj-arrow">→</span>` : '';
    const legs = (s.e?chip(s.e):'') + arrow + (s.x?chip(s.x):'');
    const open = (s.e && !s.x) ? `<span class="cj-open">미청산</span>` : '';
    return `<span class="cj-set ${cls}"><span class="cj-dir">${long?'롱':'숏'}</span>${legs}${open}</span>`;
  }).join('');
}

// 종목명 옆 4TF 상태: TF배지(RSI색) + 가격 SMA5/20 ↑↓
async function renderChartMtfState(sym, forceRefresh=false){
  const requestId = ++chartInfoSeq;
  const el = $('ciMtf'); if(!el || !sym) return;
  el.dataset.sym = sym;
  const cfg = { rsiLen: Math.max(2,+$('rsilen').value||14), smaF: Math.max(1,+$('smaf').value||9), smaS: Math.max(2,+$('smas').value||20) };
  let h = '';
  for(const tf of quadTfs()){
    try{
      const rawBars = await loadChartBars(sym, tf, CHART_KLINE_LIMIT, {force:forceRefresh});
      if(requestId!==chartInfoSeq || el.dataset.sym !== sym) return;   // 종목/요청 바뀌면 중단(stale)
      if(rawBars && rawBars.length > cfg.smaS + cfg.rsiLen + 2){
        const bars = rawBars.slice(0,-1);
        const c = bars.map(b=>b.c); const i = c.length-1;
        const col = rsiTag(c, cfg.rsiLen, cfg.smaF, cfg.smaS);
        const s5 = smaAt(c,5,i), s20 = smaAt(c,20,i);
        const ar = u=> u ? '<span style="color:#46cd8a">↑</span>' : '<span style="color:#e0584f">↓</span>';
        const tfB = col
          ? `<span class="qtag" style="color:${TAG_COLOR[col]};border-color:${TAG_COLOR[col]}66;background:${TAG_COLOR[col]}22">${tf.toUpperCase()}</span>`
          : `<span class="qtag" style="color:var(--dim);border-color:var(--border)">${tf.toUpperCase()}</span>`;
        const px = (s5!=null && s20!=null) ? `${ar(c[i]>=s5)}${ar(c[i]>=s20)}` : '';
        h += `<span class="ci-mtftf">${tfB}${px}</span>`;
      }
    }catch(e){}
  }
  if(requestId===chartInfoSeq && el.dataset.sym === sym) el.innerHTML = h;
}

  bodyEl.addEventListener('touchstart', e=>{
    multi = e.touches.length > 1;               // 핀치 등 멀티터치면 스와이프 비활성
    onChart = !!e.target.closest('.tv-lightweight-charts, canvas, .chartwrap, .pchart, .rchart');
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); moved=false;
  }, {passive:true});
  bodyEl.addEventListener('touchmove', e=>{
    if(e.touches.length > 1) multi = true;
    const t=e.touches[0];
    if(Math.abs(t.clientX-sx)>10 || Math.abs(t.clientY-sy)>10) moved=true;
  }, {passive:true});

    if(multi || onChart) return;                // 핀치·차트 위 조작이면 TF/종목 이동 안 함
    const t=e.changedTouches[0];

    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.4){

      cycleTF(1);
    }
  }, {passive:true});

async function shareChartImage(){
  const body = $('chartBody');
  const isQuad = body.classList.contains('quad');
  const PAD = 26, GAP = 16, LABEL_H = 26, TITLE_H = 56, BG = '#0b0906';
  // 패널 묶음 수집: [{label, price:canvas, rsi:canvas}]
  const groups = [];
  if(isQuad){
    [...body.querySelectorAll('.quad-cell')].forEach(cell=>{
      groups.push({
        label: cell.querySelector('.quad-label')?.textContent || '',
        price: chartCanvasFor(cell.querySelector('.pchart')),
        rsi:   chartCanvasFor(cell.querySelector('.rchart')),
      });
    });
  }else{
    groups.push({
      label: chartTF.toUpperCase(),
      price: chartCanvasFor(body.querySelector('.pchart')),
      rsi:   chartCanvasFor(body.querySelector('.rchart')),
    });
  }
  const valid = groups.filter(g=>g.price && g.rsi);
  if(!valid.length){ alert('차트가 아직 준비되지 않았어요. 잠시 후 다시 시도하세요.'); return; }

  // 셀 크기 (첫 패널 기준), 모든 패널 동일 가정
  const cw = valid[0].price.width;
  const cellH = valid[0].price.height + valid[0].rsi.height + LABEL_H;
  const cols = isQuad ? 2 : 1;
  const rows = Math.ceil(valid.length / cols);
  const W = PAD*2 + cw*cols + GAP*(cols-1);
  const H = PAD*2 + TITLE_H + cellH*rows + GAP*(rows-1);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = BG; x.fillRect(0,0,W,H);

  // 타이틀
  const sym = currentChartSymbol ? currentChartSymbol.replace('USDT','')+'/USDT' : '차트';
  const now = new Date(Date.now()+9*3600*1000).toISOString().replace('T',' ').slice(0,16)+' KST';
  x.fillStyle = '#efe4cb'; x.font = "700 22px 'Space Grotesk', sans-serif"; x.textBaseline='top';
  x.fillText(sym, PAD, PAD);
  x.fillStyle = '#a6926a'; x.font = "13px 'JetBrains Mono', monospace";
  x.fillText(`${EX[exchange].name} Perp · ${isQuad?quadTfs().map(t=>t.toUpperCase()).join('·'):chartTF.toUpperCase()} · ${now}`, PAD, PAD+28);

  // 패널 배치
  valid.forEach((g,i)=>{
    const r = Math.floor(i/cols), c = i%cols;
    const ox = PAD + c*(cw+GAP);
    const oy = PAD + TITLE_H + r*(cellH+GAP);
    x.fillStyle = '#e3b64f'; x.font = "700 15px 'JetBrains Mono', monospace";
    x.fillText(g.label, ox+2, oy+4);
    x.drawImage(g.price, ox, oy+LABEL_H, cw, g.price.height);
    x.drawImage(g.rsi,   ox, oy+LABEL_H+g.price.height, cw, g.rsi.height);
  });

  const fname = `${(currentChartSymbol||'chart').replace('USDT','')}_${isQuad?'MTF':chartTF}_${now.replace(/[: ]/g,'-')}.png`;
  const blob = await new Promise(res=>cv.toBlob(res,'image/png'));
  if(!blob){ alert('이미지 생성 실패'); return; }
  await deliverFile(blob, fname, 'image/png');
}

// ---- 파일 전달: 공유시트(에어드랍) → 미지원/실패 시 다운로드 ----
async function deliverFile(blob, fname, mime){
  const file = new File([blob], fname, {type:mime});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    // 파일만 단독 공유 — text/title을 같이 넘기면 텔레그램 등이 텍스트만 받고 파일을 버림 (Android 공유 인텐트 특성)
    try{ await navigator.share({files:[file]}); return; }
    catch(e){
      if(e.name==='AbortError') return;
      // 일부 플랫폼은 title 필요 → 2차 시도
      try{ await navigator.share({files:[file], title:fname}); return; }
      catch(e2){ if(e2.name==='AbortError') return; }
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

// o = {symbol, ex, endTime, fromMs, label} — 생략하면 현재 차트의 최신 구간
async function buildMtfSheetCanvas(o={}){
  const symbol = o.symbol || currentChartSymbol;
  const ex = o.ex || exchange;
  if(!symbol) throw new Error('종목이 선택되지 않았습니다');
  const tfs = quadTfs();
  // TF별 창 계획: 진입~청산이 다 들어오게 봉 수를 잡고,
  // 그래도 못 담는 짧은 TF(예: 이틀짜리 매매의 5m)는 그 TF만 진입 시점으로 창을 옮긴다.
  // (청산 뒤 빈 구간을 18시간 보여주는 것보다 진입 세팅을 보는 게 복기에 쓸모 있다)
  const plan = tfs.map(tf=>{
    const ms = TF_MS[tf] || 36e5;
    if(!o.fromMs || !o.endTime) return {tf, bars:SHEET_BARS, endT:null, entryFocus:false};
    const span = Math.ceil((o.endTime - o.fromMs) / ms);
    const bars = Math.max(34, Math.min(220, span + 14));   // 앞뒤 여유 + 최소 34봉
    const win  = bars * ms;                                 // 이 TF가 실제로 담는 시간
    if(o.endTime - o.fromMs > win){
      return {tf, bars, endT: Math.min(o.endTime, o.fromMs + Math.round(win*0.7)), entryFocus:true};
    }
    return {tf, bars, endT:o.endTime, entryFocus:false};
  });
  const cols   = SHEET_COLS;
  const rows   = Math.ceil(tfs.length / cols);
  const cellW  = Math.floor(SHEET_W / cols);        // 620
  const cellH  = Math.floor(SHEET_H / rows);        // 876
  const priceH = Math.round(cellH * SHEET_PR);
  const rsiH   = cellH - priceH;

  // 숨긴 호스트: display:none이면 clientWidth가 0이라 차트 폭이 죽는다 → 화면 밖으로 밀어낸다
  // 배치는 캔버스에서 하므로 호스트는 그냥 세로로 쌓되, 폭만 셀 폭(=모바일 스케일)으로 맞춘다
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-30000px;top:0;width:'+cellW+'px;background:'+SHEET_BG+';z-index:-1;pointer-events:none';
  host.innerHTML = tfs.map(()=>
    '<div style="width:'+cellW+'px">'+
      '<div class="pchart" style="width:'+cellW+'px;height:'+priceH+'px"></div>'+
      '<div class="rchart" style="width:'+cellW+'px;height:'+rsiH+'px"></div>'+
    '</div>').join('');
  document.body.appendChild(host);

  const base  = charts.length;          // buildPair가 전역 charts에 push하므로 경계를 기억
  const cells = [...host.children];
  let mine = [], out = null;
  try{
    await Promise.all(plan.map((pl,k)=>
      buildPair(cells[k].querySelector('.pchart'), cells[k].querySelector('.rchart'),
                symbol, pl.tf, priceH, rsiH, pl.bars,
                false, null, {renderId: chartRenderSeq, endTime:pl.endT, ex})
    ));
    mine = charts.splice(base);         // 화면 차트와 섞이지 않게 전역에서 분리
    if(!mine.length) throw new Error('차트 렌더 실패 (데이터 로드 확인)');
    mine.forEach(({chart})=>{ try{ chart.applyOptions({layout:{fontSize:SHEET_FONT}}); }catch(e){} });
    // 폰트 변경 반영 + 첫 페인트 대기
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,150))));

    const cv = document.createElement('canvas');
    cv.width = SHEET_W; cv.height = SHEET_H;
    const x = cv.getContext('2d');
    x.fillStyle = SHEET_BG; x.fillRect(0,0,SHEET_W,SHEET_H);
    const shot = el => { const c = mine.find(m=>m.el===el); try{ return c ? c.chart.takeScreenshot() : null; }catch(e){ return null; } };

    let ok = 0;
    tfs.forEach((tf,k)=>{
      const cx = (k % cols) * cellW;
      const cy = Math.floor(k / cols) * cellH;
      const p = shot(cells[k].querySelector('.pchart'));
      const r = shot(cells[k].querySelector('.rchart'));
      if(p){ x.drawImage(p, cx, cy, cellW, priceH); ok++; }
      if(r){ x.drawImage(r, cx, cy+priceH, cellW, rsiH); }
      // 셀 구분선 (1px) — 여백을 만들지 않고 경계만
      x.fillStyle = '#3a2e14';
      if(k % cols) x.fillRect(cx, cy, 1, cellH);
      if(Math.floor(k / cols)) x.fillRect(cx, cy, cellW, 1);
      // TF 배지 (높이 차지 없이 셀 좌상단에 겹쳐 씀)
      const ef = plan[k].entryFocus;
      x.fillStyle = 'rgba(11,9,6,.74)'; x.fillRect(cx+1, cy+1, ef?146:84, 26);
      x.fillStyle = '#e3b64f'; x.font = "700 18px 'JetBrains Mono', monospace"; x.textBaseline = 'top';
      x.fillText(tf.toUpperCase(), cx+9, cy+5);
      if(ef){ x.fillStyle = '#a6926a'; x.font = "600 13px 'JetBrains Mono', monospace";
              x.fillText('진입기준', cx+9+tf.length*13+8, cy+8); }
    });
    if(!ok) throw new Error('차트 캡처 실패');

    // 식별용 오버레이 — 좌상단 셀의 TF 배지 오른쪽에만 겹쳐 씀 (2열이라 전폭을 덮으면 안 됨)
    const head = o.label || (symbol.replace('USDT','')+'/USDT · '+EX[ex].name+' · '+sheetStamp()+' KST');
    x.fillStyle = 'rgba(11,9,6,.74)'; x.fillRect(86, 1, cellW-87, 26);
    x.fillStyle = '#efe4cb'; x.font = "700 15px 'JetBrains Mono', monospace"; x.textBaseline = 'top';
    x.fillText(head, 94, 6);

    out = cv;
  } finally {
    if(!mine.length) mine = charts.splice(base);          // 예외로 빠져나온 경우 회수
    mine.forEach(({chart})=>{ try{ chart.remove(); }catch(e){} });
    host.remove();
  }
  return out;
}

async function exportMtfSheetPdf(o={}){
  const cv = await buildMtfSheetCanvas(o);
  if(!cv) throw new Error('시트 생성 실패');
  const stamp = sheetStamp().replace(/[: ]/g,'-');
  const fbase = o.fname || ((o.symbol||currentChartSymbol||'chart').replace('USDT','')+'_MTF_'+stamp);
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J){   // CDN 차단 등 jsPDF 부재 → PNG 폴백 (시트 자체는 이미 만들어졌으므로 버리지 않는다)
    const blob = await new Promise(res=>cv.toBlob(res,'image/png'));
    await deliverFile(blob, fbase+'.png', 'image/png');
    return;
  }
  const pdf = new J({orientation:'portrait', unit:'pt', format:'a4'});
  pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, 595.28, 841.89, undefined, 'FAST');   // 여백 0 풀블리드
  await deliverFile(pdf.output('blob'), fbase+'.pdf', 'application/pdf');
}
$('chartShare').addEventListener('click', async ()=>{
  const btn=$('chartShare'); btn.disabled=true; const o=btn.innerHTML; btn.textContent='생성 중…';
  try{ await shareChartImage(); }catch(e){ alert('공유 실패: '+e.message); }
  btn.disabled=false; btn.innerHTML=o;
});
$('chartPdf').addEventListener('click', async ()=>{
  const btn=$('chartPdf'); btn.disabled=true; const o=btn.innerHTML; btn.textContent='생성 중…';
  try{ await exportMtfSheetPdf(); }catch(e){ alert('PDF 생성 실패: '+e.message); }
  btn.disabled=false; btn.innerHTML=o;
});
