<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YHAL Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0d1420; --surface:#131c2b; --border:#212d40;
    --text:#e6ecf5; --muted:#7b899e; --amber:#f4c84b;
    --green:#46cd8a; --red:#e0584f; --blue:#5b9bd5;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--mono);width:100%;height:100%;overflow:hidden}
  #wrap{width:100%;height:100%;display:flex;flex-direction:column;padding:12px 12px 8px}
  .head{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .sym{font-size:19px;font-weight:700;letter-spacing:.02em}
  .tf{font-size:12px;color:var(--amber);font-weight:600}
  .ex{font-size:11px;color:var(--muted)}
  .last{font-size:13px;font-weight:600;margin-left:auto}
  .chg{font-size:12px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)}
  .legend{font-size:10px;color:var(--muted);display:flex;gap:9px;margin:2px 0 6px;flex-wrap:wrap}
  .legend b{font-weight:600}
  .l5{color:#5fd6c4}.l10{color:#bf95f0}.l20{color:#d77b38}.l50{color:#c9a53d}.l120{color:#3aad64}.l200{color:#f1f4f8}
  .lr9{color:var(--amber)}.lr20{color:#bf95f0}
  #price{flex:1 1 auto;min-height:0}
  #rsi{flex:0 0 30%;min-height:0;border-top:1px solid var(--border)}
  .rsihead{font-size:10px;color:var(--muted);margin:5px 0 2px}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--bg);color:var(--muted);font-size:14px;text-align:center;padding:20px}
  .foot{font-size:9px;color:var(--muted);text-align:right;margin-top:4px;opacity:.7}
</style>
</head>
<body>
<div id="wrap">
  <div class="head">
    <span class="sym" id="hSym">—</span>
    <span class="tf" id="hTf"></span>
    <span class="ex" id="hEx"></span>
    <span class="last" id="hLast"></span>
    <span class="chg" id="hChg"></span>
  </div>
  <div class="legend">
    <b class="l5">SMA5</b><b class="l10">10</b><b class="l20">20</b><b class="l50">50</b><b class="l120">120</b><b class="l200">200</b>
    <b style="color:var(--muted)">· BB(20,2)</b><b style="color:#5b9bd5">· MACD</b>
  </div>
  <div id="price"></div>
  <div class="rsihead">RSI 캔들 · <b class="lr9">SMA9</b> · <b class="lr20">SMA20</b> · BB(20,2) · 30/50/70</div>
  <div id="rsi"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="err"></div>

<script>
// ───────────────────────────────────────────────────────────
// URL 파라미터: ?ex=bybit&symbol=BTCUSDT&tf=15m&bars=100
// 렌더 완료 시 window.__READY = true  (봇이 이 값을 폴링)
// ───────────────────────────────────────────────────────────
window.__READY = false;
window.__ERROR = null;

const CHART_TZ = 9*3600;   // KST 표시 (lightweight-charts UTC축 → +9h)
const TF_LIST = ['1m','3m','5m','15m','30m','1h','4h','1w'];

function qp(k, d){ const v = new URLSearchParams(location.search).get(k); return v==null ? d : v; }

// ── 거래소 어댑터 (klines만) ──
const EX = {
  binance: {
    name:'Binance',
    map:{'1m':'1m','3m':'3m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','4h':'4h','1w':'1w'},
    async klines(symbol, tf, limit){
      const iv = this.map[tf]; if(!iv) return null;
      const raw = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${iv}&limit=${limit}`).then(r=>r.json());
      if(!Array.isArray(raw)) return null;
      return raw.map(k=>({t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4]}));
    }
  },
  bybit: {
    name:'Bybit',
    map:{'1m':'1','3m':'3','5m':'5','15m':'15','30m':'30','1h':'60','4h':'240','1w':'W'},
    async klines(symbol, tf, limit){
      const iv = this.map[tf]; if(!iv) return null;
      const j = await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${iv}&limit=${limit}`).then(r=>r.json());
      const list = j.result?.list;
      if(!Array.isArray(list)) return null;
      return list.slice().reverse().map(k=>({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4]}));
    }
  }
};

// ── 지표 계산 ──
function sma(arr, p, i){ if(i-p+1<0) return null; let s=0; for(let k=i-p+1;k<=i;k++){ if(arr[k]==null) return null; s+=arr[k]; } return s/p; }
function priceSMA(closes, t, p){ const o=[]; for(let i=0;i<closes.length;i++){ const v=sma(closes,p,i); if(v!=null) o.push({time:t[i],value:v}); } return o; }
function bollinger(closes, t, p, mult){
  const up=[],mid=[],lo=[];
  for(let i=0;i<closes.length;i++){ const m=sma(closes,p,i); if(m==null) continue;
    let v=0; for(let k=i-p+1;k<=i;k++){ const d=closes[k]-m; v+=d*d; } const sd=Math.sqrt(v/p);
    up.push({time:t[i],value:m+mult*sd}); mid.push({time:t[i],value:m}); lo.push({time:t[i],value:m-mult*sd});
  }
  return {up,mid,lo};
}
// Wilder RSI → OHLC 캔들 (시가/고가/저가/종가를 각각 RSI화)
function rsiSeries(vals, len){
  const out = new Array(vals.length).fill(null);
  let ag=0, al=0;
  for(let i=1;i<vals.length;i++){
    const d = vals[i]-vals[i-1];
    const g = d>0?d:0, l = d<0?-d:0;
    if(i<=len){ ag+=g; al+=l; if(i===len){ ag/=len; al/=len; out[i]=100-100/(1+ag/(al||1e-9)); } }
    else { ag=(ag*(len-1)+g)/len; al=(al*(len-1)+l)/len; out[i]=100-100/(1+ag/(al||1e-9)); }
  }
  return out;
}
function rsiCandles(O,H,L,C,len){
  const rC=rsiSeries(C,len), rO=rsiSeries(O,len), rH=rsiSeries(H,len), rL=rsiSeries(L,len);
  return {rO,rH,rL,rC};
}
function macdCalc(closes, fast=12, slow=26, sig=9){
  const ema=(arr,p)=>{ const k=2/(p+1); const out=new Array(arr.length).fill(null); let prev=null;
    for(let i=0;i<arr.length;i++){ const v=arr[i]; if(v==null)continue; prev=(prev==null)?v:v*k+prev*(1-k); out[i]=prev; } return out; };
  const ef=ema(closes,fast), es=ema(closes,slow);
  const macd=new Array(closes.length).fill(null);
  for(let i=0;i<closes.length;i++){ if(ef[i]!=null&&es[i]!=null&&i>=slow-1) macd[i]=ef[i]-es[i]; }
  const sigArr=ema(macd.map(v=>v==null?0:v), sig);
  const signal=new Array(closes.length).fill(null), hist=new Array(closes.length).fill(null);
  for(let i=0;i<closes.length;i++){ if(macd[i]!=null&&sigArr[i]!=null&&i>=slow+sig-2){ signal[i]=sigArr[i]; hist[i]=macd[i]-sigArr[i]; } }
  return {macd, signal, hist};
}

function fmtPrice(v){
  if(v>=1000) return v.toLocaleString('en-US',{maximumFractionDigits:2});
  if(v>=1) return v.toFixed(3);
  if(v>=0.01) return v.toFixed(5);
  return v.toPrecision(4);
}

function chartCommon(){
  return {
    layout:{background:{type:'solid',color:'transparent'}, textColor:'#7b899e', fontFamily:"'JetBrains Mono', monospace", fontSize:10},
    grid:{vertLines:{visible:false}, horzLines:{visible:false}},
    timeScale:{borderColor:'#212d40', timeVisible:true, secondsVisible:false, rightOffset:6, barSpacing:6, minBarSpacing:2},
    rightPriceScale:{borderColor:'#212d40', scaleMargins:{top:0.1, bottom:0.1}, minimumWidth:64},
    crosshair:{mode:0},
    handleScroll:false, handleScale:false
  };
}

async function main(){
  const exParam = (qp('ex','auto')||'auto').toLowerCase();   // 기본 auto = 바이낸스 우선 → 없으면 바이빗
  const symbol = (qp('symbol','BTCUSDT')||'BTCUSDT').toUpperCase();
  const tf = (qp('tf','15m')||'15m').toLowerCase();
  const bars = Math.max(30, Math.min(400, parseInt(qp('bars','120'))||120));

  if(!TF_LIST.includes(tf)){ return fail(`지원 안 하는 TF: ${tf}\n(${TF_LIST.join(' ')})`); }

  // 거래소 시도 순서 결정
  let order;
  if(exParam==='binance') order = ['binance'];
  else if(exParam==='bybit') order = ['bybit'];
  else order = ['binance','bybit'];   // auto

  document.getElementById('hSym').textContent = symbol.replace(/USDT$/,'');
  document.getElementById('hTf').textContent = tf.toUpperCase();

  let raw = null, usedEx = null;
  for(const exId of order){
    try{
      const r = await EX[exId].klines(symbol, tf, bars+210);
      if(r && r.length >= 5){ raw = r; usedEx = exId; break; }
    }catch(e){ /* 다음 거래소 시도 */ }
  }
  if(!raw){
    const tried = order.map(e=>EX[e].name).join(' → ');
    return fail(`${symbol} 데이터 없음\n(${tried} 모두 없음 · 심볼 확인)`);
  }
  document.getElementById('hEx').textContent = '· '+EX[usedEx].name;

  const t = raw.map(b=>Math.floor(b.t/1000)+CHART_TZ);
  const O=raw.map(b=>b.o), H=raw.map(b=>b.h), L=raw.map(b=>b.l), C=raw.map(b=>b.c);
  const pls = {priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false};

  // 헤더 시세
  const last = C[C.length-1], prev = C[C.length-2]||last;
  const chg = prev>0 ? (last/prev-1)*100 : 0;
  document.getElementById('hLast').textContent = fmtPrice(last);
  const chgEl = document.getElementById('hChg');
  chgEl.textContent = (chg>=0?'+':'')+chg.toFixed(2)+'%';
  chgEl.className = 'chg '+(chg>=0?'up':'down');

  const LC = LightweightCharts;

  // ── 가격 패널 ──
  const pc = LC.createChart(document.getElementById('price'), {...chartCommon(), width:document.getElementById('price').clientWidth, height:document.getElementById('price').clientHeight});
  pc.priceScale('right').applyOptions({scaleMargins:{top:0.06, bottom:0.28}});   // 아래 28% = MACD 자리
  const pcs = pc.addCandlestickSeries({upColor:'#46cd8a',downColor:'#e0584f',borderVisible:false,wickUpColor:'#46cd8a',wickDownColor:'#e0584f'});
  pcs.setData(raw.map((b,i)=>({time:t[i],open:b.o,high:b.h,low:b.l,close:b.c})));
  // BB(20,2)
  if(C.length>=25){ const bb=bollinger(C,t,20,2);
    pc.addLineSeries({color:'rgba(88,106,134,.8)',lineWidth:1,...pls}).setData(bb.up);
    pc.addLineSeries({color:'rgba(143,163,196,.6)',lineWidth:1,lineStyle:LC.LineStyle.Dotted,...pls}).setData(bb.mid);
    pc.addLineSeries({color:'rgba(88,106,134,.8)',lineWidth:1,...pls}).setData(bb.lo);
  }
  // SMA 5·10·20·50·120·200
  [[5,'#5fd6c4',1],[10,'#bf95f0',1],[20,'#d77b38',1.5]].forEach(([p,c,w])=>{
    if(C.length>=p) pc.addLineSeries({color:c,lineWidth:w,...pls}).setData(priceSMA(C,t,p));
  });
  [[50,'#c9a53d',1],[120,'#3aad64',1],[200,'#f1f4f8',2]].forEach(([p,c,w])=>{
    if(C.length>=p) pc.addLineSeries({color:c,lineWidth:w,...pls,autoscaleInfoProvider:()=>null}).setData(priceSMA(C,t,p));
  });
  // MACD — 가격 차트 안 별도 스케일(아래쪽)에 배치 → 시간축 완전 일치
  { const mac = macdCalc(C,12,26,9);
    const hist=[],ml=[],sl=[];
    for(let i=0;i<t.length;i++){
      if(mac.hist[i]!=null) hist.push({time:t[i],value:mac.hist[i],color:mac.hist[i]>=0?'rgba(70,205,138,.55)':'rgba(224,88,79,.55)'});
      if(mac.macd[i]!=null) ml.push({time:t[i],value:mac.macd[i]});
      if(mac.signal[i]!=null) sl.push({time:t[i],value:mac.signal[i]});
    }
    const mo = {priceScaleId:'macd', priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false};
    pc.addHistogramSeries({...mo}).setData(hist);
    pc.addLineSeries({...mo, color:'#5b9bd5', lineWidth:1}).setData(ml);
    pc.addLineSeries({...mo, color:'#f4a73c', lineWidth:1}).setData(sl);
    pc.priceScale('macd').applyOptions({scaleMargins:{top:0.74, bottom:0.02}, visible:false});
  }

  // ── RSI 패널 ──
  const rc = LC.createChart(document.getElementById('rsi'), {...chartCommon(), width:document.getElementById('rsi').clientWidth, height:document.getElementById('rsi').clientHeight});
  const R = rsiCandles(O,H,L,C,14);
  const rcData=[];
  for(let i=0;i<t.length;i++){ if(R.rO[i]==null||R.rC[i]==null||R.rH[i]==null||R.rL[i]==null) continue;
    rcData.push({time:t[i],open:R.rO[i],high:Math.max(R.rO[i],R.rH[i],R.rL[i],R.rC[i]),low:Math.min(R.rO[i],R.rH[i],R.rL[i],R.rC[i]),close:R.rC[i]});
  }
  rc.addCandlestickSeries({upColor:'#46cd8a',downColor:'#e0584f',borderVisible:false,wickUpColor:'#46cd8a',wickDownColor:'#e0584f'}).setData(rcData);
  const rs9=[],rs20=[];
  for(let i=0;i<t.length;i++){ const a=sma(R.rC,9,i), b=sma(R.rC,20,i); if(a!=null)rs9.push({time:t[i],value:a}); if(b!=null)rs20.push({time:t[i],value:b}); }
  rc.addLineSeries({color:'#f4c84b',lineWidth:1,...pls}).setData(rs9);
  rc.addLineSeries({color:'#bf95f0',lineWidth:1,...pls}).setData(rs20);
  // RSI BB
  { const rbbU=[],rbbL=[];
    for(let i=0;i<t.length;i++){ const m=sma(R.rC,20,i); if(m==null)continue;
      let v=0,ok=1; for(let k=i-19;k<=i;k++){ if(R.rC[k]==null){ok=0;break;} const d=R.rC[k]-m; v+=d*d; } if(!ok)continue;
      const sd=Math.sqrt(v/20); rbbU.push({time:t[i],value:m+2*sd}); rbbL.push({time:t[i],value:m-2*sd});
    }
    rc.addLineSeries({color:'rgba(88,106,134,.7)',lineWidth:1,...pls}).setData(rbbU);
    rc.addLineSeries({color:'#3fb0a0',lineWidth:1,...pls}).setData(rbbL);
  }
  [[70,'#e0584f'],[50,'#7b899e'],[30,'#5b9bd5']].forEach(([lv,c])=>{
    rc.addLineSeries({color:c,lineWidth:1,lineStyle:LC.LineStyle.Dotted,...pls,autoscaleInfoProvider:()=>null}).setData(t.map(x=>({time:x,value:lv})));
  });

  // 최근 bars개만 표시 + 시간축 동기화
  const total = t.length, from = Math.max(0, total-bars);
  [pc, rc].forEach(c=>{ try{ c.timeScale().setVisibleLogicalRange({from, to: total-1+6}); }catch(e){} });

  document.getElementById('foot').textContent = new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}) + ' KST';

  // 렌더 완료 신호 (봇이 폴링) — 2프레임 + 약간의 여유
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setTimeout(()=>{ window.__READY = true; document.title = 'READY'; }, 350);
  }));
}

function fail(msg){
  window.__ERROR = msg;
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.innerHTML = `<div style="font-size:32px">⚠️</div><div>${msg.replace(/\n/g,'<br>')}</div>`;
  window.__READY = true;   // 봇이 에러 화면이라도 캡처하도록
  document.title = 'READY';
}

main().catch(e=>fail('오류: '+(e && e.message || e)));
</script>
</body>
</html>
